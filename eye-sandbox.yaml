# Local simulator for the cartoon eye — renders in an SDL window on your Mac,
# no hardware, no upload.
#
#   ./run-sandbox.sh
#
# The animation lives in eye-lambda.yaml and the state in eye-globals.yaml;
# both are shared with eye-device.yaml so the two configs cannot drift.
esphome:
  name: eye-sandbox
  friendly_name: Eye Sandbox

host:
  mac_address: 98:35:69:ab:f6:79

globals: !include eye-globals.yaml

display:
  - platform: sdl
    dimensions: 240x240
    # MUST match eye-device.yaml. GAZE_* counts frames, not milliseconds, so
    # a difference here scales the animation on one side only.
    update_interval: 200ms
    # Not load-bearing: the renderer repaints the whole frame and calls
    # it.fill() itself. Kept false to skip a redundant clear on both targets.
    auto_clear_enabled: false
    lambda: !include eye-lambda.yaml