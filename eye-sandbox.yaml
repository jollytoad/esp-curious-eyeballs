# Local simulator for the cartoon eye — renders in an SDL window on your Mac,
# no hardware, no upload.
#
#   .venv/bin/esphome run eye-sandbox.yaml
#
# The animation itself lives in eye-lambda.yaml and the state in
# eye-globals.yaml; both are shared with eye-device.yaml so the two configs
# can never drift apart.
esphome:
  name: eye-sandbox
  friendly_name: Eye Sandbox

host:
  mac_address: 98:35:69:ab:f6:79

globals: !include eye-globals.yaml

display:
  - platform: sdl
    dimensions: 240x240
    # Must match update_interval in eye-device.yaml. At 80 ms these GAZE_*
    # constants gave a 160 ms saccade and 0.64-4.4 s of staring, which is not
    # what the comments in eye-lambda.yaml claimed and not what the device
    # was doing. Both are 200 ms now: 400 ms saccade, 1.6-11 s of staring.
    update_interval: 200ms
    # REQUIRED by the incremental renderer in eye-lambda.yaml, which only
    # repaints where the iris moved and relies on the rest of the frame
    # surviving from the previous update. This option DEFAULTS TO TRUE, and
    # true means Display::do_update_() wipes the whole frame to black before
    # the lambda runs - so the screen ends up black except where the iris
    # happens to be. Keep it false here AND in the device config.
    auto_clear_enabled: false
    lambda: !include eye-lambda.yaml
