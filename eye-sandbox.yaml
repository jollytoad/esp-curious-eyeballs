# Local simulator for the eye — an SDL window on this machine, no hardware,
# no upload.
#
#   ./run-sandbox.sh
#
# The renderer is eye-render.cpp and the state is eye-globals.yaml; both
# are shared with eye-device.yaml so the two configs cannot drift.
esphome:
  name: eye-sandbox
  includes:
    - eye-render.cpp
    - eye-look.h
  friendly_name: Eye Sandbox

host:
  mac_address: 98:35:69:ab:f6:79

# The renderer logs its vessel bake time and the interval below logs each phase.
# Without this component ESP_LOGI compiles away to nothing and the sandbox is
# silent - it is easy to mistake for the interval not running.
logger:
  level: INFO

# SANDBOX ONLY. The device has no web server and must never grow one - see the
# no-network note in eye-device.yaml.
#
# NOTE: the host platform has NO interactive UI at all - no web_server, no api,
# no mqtt, no number. A switch here would be an entity with nothing to press it,
# so presence is driven on a timer instead. The eye cycles green/round ->
# red/slit -> back, forever, with a log line naming the current phase.
globals: !include eye-globals.yaml

interval: !include eye-presence.yaml

display:
  - platform: sdl
    dimensions: 240x240
    # MUST match eye-device.yaml. GAZE_* counts frames, not milliseconds, so
    # a difference here scales the animation on one side only.
    update_interval: 90ms
    # Not load-bearing: the renderer repaints the whole frame and calls
    # it.fill() itself. Kept false to skip a redundant clear on both targets.
    auto_clear_enabled: false
    lambda: |-
      #include "eye-look.h"
      // eye_render is declared in eye-look.h, which both this file and
      // eye-render.cpp include, so there is no hand-written declaration here.
      eye::EyeLook look{
          (float) id(demo),
          id(look_yaw), id(look_pitch),
          id(look_jitter),
          id(look_hue),
          id(look_pupil_w), id(look_pupil_h),
          id(look_vein_tint),
      };
      eye_render(&it, &id(yaw), &id(pitch),
                 &id(yaw_t), &id(pitch_t),
                 &id(yaw_s), &id(pitch_s),
                 &id(gmove), &id(ghold), &id(frame),
                 &id(presence), &id(pres_f),
                 &id(pres_hold), &id(pres_seen),
                 look);
