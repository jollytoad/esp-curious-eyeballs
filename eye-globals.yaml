# Shared animation state for the cartoon eye.
# Included by eye-sandbox.yaml (local SDL) and your device config.
#
# The gaze is stored as rotation ANGLES in degrees, not pixel offsets: yaw
# about the vertical axis, pitch about the horizontal. That is what lets the
# renderer project the iris and pupil as real circles on a sphere.
- {id: yaw,     type: float, restore_value: no, initial_value: '0'}   # current gaze
- {id: pitch,   type: float, restore_value: no, initial_value: '0'}
- {id: yaw_t,   type: float, restore_value: no, initial_value: '0'}   # saccade target
- {id: pitch_t, type: float, restore_value: no, initial_value: '0'}
- {id: yaw_s,   type: float, restore_value: no, initial_value: '0'}   # saccade start
- {id: pitch_s, type: float, restore_value: no, initial_value: '0'}
- {id: gmove,   type: int,   restore_value: no, initial_value: '0'}   # frames left in
  # the current saccade; 0 = not moving
- {id: ghold,   type: int,   restore_value: no, initial_value: '0'}   # frames left of
  # staring before the next saccade

# Pupil radius in pixels, head-on. Converted to an angle each frame.
- {id: pupil,   type: float, restore_value: no, initial_value: '13'}
- {id: pupil_t, type: float, restore_value: no, initial_value: '13'}

- {id: ir,  type: float, restore_value: no, initial_value: '60'}
- {id: ig,  type: float, restore_value: no, initial_value: '140'}
- {id: ib,  type: float, restore_value: no, initial_value: '210'}
- {id: irt, type: float, restore_value: no, initial_value: '60'}
- {id: igt, type: float, restore_value: no, initial_value: '140'}
- {id: ibt, type: float, restore_value: no, initial_value: '210'}

