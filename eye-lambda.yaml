|-
  // =====================================================================
  // Cartoon eye for a 240x240 round GC9A01A, rendered on a sphere.
  //
  // CONSTRAINT: this build is SOFT-FLOAT. Measured on the target -
  //   sqrtf 6000 ns, float multiply 1800 ns (an FPU would be 1-4).
  // A float pixel loop costs ~33,600 ns/px here, which is 957 ms a frame.
  // So every per-pixel operation below is integer. Floats appear only once
  // per frame, to derive the gaze basis.
  //
  // Model: the eyeball is a sphere of radius R seen head-on. Every visible
  // pixel has a surface normal. The iris and pupil are two circles ON that
  // sphere, concentric about the eye's forward axis; the gaze is the angle
  // between that axis and the viewer. Foreshortening and the elliptical iris
  // fall out of one rotation - nothing is faked per screen axis.
  //
  // Per pixel (integer):
  //   1. r2 = dx*dx + dy*dy
  //   2. nz8 = NZ_LUT[r2]           unit sphere z, 0..255  (1 load)
  //   3. dot the normal with the forward axis -> angle from gaze
  //   4. classify sclera / iris / pupil, shade, draw
  // =====================================================================

  // ================= tunables =================
  // Gaze is stored as angles in degrees. A real eye reaches ~30 deg each way
  // horizontally and ~20 deg vertically; cartoons are more expressive.
  const float YAW_MAX   = 52.0f;
  const float PITCH_MAX = 38.0f;
  const int   GAZE_FRAMES  = 2;      // frames per saccade (80 ms each)
  const int   GAZE_HOLD_MIN = 8;     // 0.64 s at 80 ms/frame
  const int   GAZE_HOLD_MAX = 55;    // 4.4 s

  // Iris size is an ANGLE on the sphere, so it is the same physical size
  // wherever the eye looks. 21 deg renders ~34 px head-on.
  const float IRIS_ANGLE = 21.0f;

  // Pupil size as a fraction of the IRIS RADIUS, so changing IRIS_ANGLE
  // cannot leave the pupil stranded at some unrelated pixel size.
  //
  // Needs no pixel->angle conversion: the pupil's angular radius is
  // asin(FRAC * sin(IRIS_ANGLE)), and since sin(asin(x)) == x the Q8 value is
  // just FRAC * SIN_IRIS. Exact, no rounding drift.
  const float PUPIL_FRACTION = 0.50f;

  // Extra darkening toward the bottom of the eyeball.
  const float SHADE_VERTICAL = 0.10f;

  const int CX = 120, CY = 120, R = 96;
  const int R_SQ = R * R;

  Color INK(0x1A, 0x14, 0x12);          // outline / brow
  Color SCLERA_HI(0xFF, 0xFD, 0xF6);    // brightest, facing the light
  Color SCLERA_LO(0xA8, 0x9E, 0x8C);    // shadowed, at the rim
  Color SKIN(0x14, 0x10, 0x18);         // backdrop
  Color WHITE(0xFF, 0xFF, 0xFF);
  // Bright centre of the iris; the ramp runs from this at the pupil edge
  // down to black at the limbus.
  Color IRIS_BASE(200, 45, 45);

  // ================= lookup tables =================
  // Built once on the first invocation, in slices so no single call blocks
  // long. Between them these remove every sqrt from the loop.
  //
  //   NZ_LUT[r2]     sphere z at squared radius r2, Q8
  //   ACROSS_LUT[a]  perpendicular component of a unit vector whose forward
  //                  component is a/256 - fixed, so no sqrt needed there either
  //
  // 9.5 kB total, against 36 kB for a 2D shade table.
  //
  // Q8 encodes 1.0 as 256, which does NOT fit a uint8_t. NZ_LUT hits 256 at
  // r2=0 and ACROSS_LUT at a=0; casting straight to uint8_t wraps both to 0.
  // With nz=0 the centre pixels compute along=0, fall below COS_IRIS, and
  // shade as mid-grey sclera - a grey dot in the pupil, in the same screen
  // pixels at every gaze angle. Hence EYE_Q8.
  static uint8_t NZ_LUT[R_SQ + 1];
  static uint8_t ACROSS_LUT[257];
  static int32_t nz_built = 0;
  {
    #define EYE_Q8(v) ((uint8_t) ((v) > 255 ? 255 : (int) (v)))
    if (nz_built < R_SQ + 1) {
      int32_t end = nz_built + 512;
      if (end > R_SQ + 1) end = R_SQ + 1;
      for (int32_t r2 = nz_built; r2 < end; r2++)
        NZ_LUT[r2] = EYE_Q8(sqrtf((float) (R_SQ - r2)) * 256.0f / (float) R + 0.5f);
      nz_built = end;
    }
    for (int a = 0; a <= 256; a++)
      ACROSS_LUT[a] = EYE_Q8(sqrtf(1.0f - ((float) a / 256.0f) * ((float) a / 256.0f)) * 256.0f + 0.5f);
    #undef EYE_Q8
  }

  // ================= per-band bookkeeping =================
  // Rect() default-constructs every field to VALUE_NO_SET (32766), so
  // get_clipping() returns a sentinel rect when nothing is clipped - NOT
  // zeros. is_set() is the supported test for that.
  //
  // IMPORTANT: mipi_spi never calls set_clipping(), so on that platform this
  // is ALWAYS unset - it is not a band rect. first_band is therefore always
  // true, and the y_start/y_end clamp below never fires.
  //
  // That is only correct because we run a FULL-FRAME buffer (buffer_size 1.0,
  // FRACTION 1), where there is exactly one band per update and "first band"
  // means "the only band". With a smaller buffer the lambda runs once per
  // band, and since first_band cannot detect that, the gaze machine below
  // would advance once per band - at 1/6, six times per displayed frame,
  // making every GAZE_* constant effectively six times too fast.
  Rect clip = it.get_clipping();
  bool has_clip = clip.is_set();
  bool first_band = !has_clip || (clip.y == 0);

  // ================= gaze ====================
  // Only advance on the first band of a frame, otherwise the state machine
  // runs once per band and the eye visibly tears.
  if (first_band && id(gmove) > 0) {
    id(gmove)--;
    float t = 1.0f - (float) id(gmove) / (float) GAZE_FRAMES;
    t = t * t * (3.0f - 2.0f * t);     // smoothstep: eases out and settles
    id(yaw)   = id(yaw_s)   + (id(yaw_t)   - id(yaw_s))   * t;
    id(pitch) = id(pitch_s) + (id(pitch_t) - id(pitch_s)) * t;
  } else if (first_band && id(ghold) > 0) {
    id(ghold)--;
  } else if (first_band) {
    // uniform over an ellipse of reachable angles
    float ang = esphome::random_float() * 6.2831853f;
    float rad = sqrtf(esphome::random_float());
    id(yaw_t)   = cosf(ang) * rad * YAW_MAX;
    id(pitch_t) = sinf(ang) * rad * PITCH_MAX;
    id(yaw_s)   = id(yaw);
    id(pitch_s) = id(pitch);
    id(gmove) = GAZE_FRAMES;
    id(ghold) = GAZE_HOLD_MIN +
                (int) (esphome::random_float() * (float) (GAZE_HOLD_MAX - GAZE_HOLD_MIN));
  }

  // ================= the eye's frame =================
  // Rotating the sphere so the iris faces wherever the eye is looking. These
  // are the only floats in the hot path: four cos/sin per frame.
  const float DEG = 0.0174532925f;
  const float yaw_rad = id(yaw) * DEG, pitch_rad = id(pitch) * DEG;
  const float cyw = cosf(yaw_rad), syw = sinf(yaw_rad);
  const float cpt = cosf(pitch_rad), spt = sinf(pitch_rad);

  // eye forward axis in screen space (x right, y down, z toward viewer)
  const float fwd_x = syw * cpt, fwd_y = spt, fwd_z = cyw * cpt;

  // Q8 for the integer loop: ~0.4 deg of angular resolution, far finer than
  // the shading needs.
  const int FWD_X = (int) (fwd_x * 256.0f);
  const int FWD_Y = (int) (fwd_y * 256.0f);
  const int FWD_Z = (int) (fwd_z * 256.0f);

  const int COS_IRIS = (int) (cosf(IRIS_ANGLE * DEG) * 256.0f);
  const int SIN_IRIS = (int) (sinf(IRIS_ANGLE * DEG) * 256.0f);
  const int SIN_PUPIL = (int) (PUPIL_FRACTION * (float) SIN_IRIS);

  // Fixed directional light, upper left.
  const int LIT_X = (int) (-0.55f * 256.0f);
  const int LIT_Y = (int) (-0.45f * 256.0f);
  const int LIT_Z = (int) (0.70f * 256.0f);
  const int VERTICAL_Q8 = (int) (SHADE_VERTICAL * 256.0f);

  // Colour ramps expanded to integers once per frame.
  const int SR = SCLERA_LO.r - SCLERA_HI.r;
  const int SG = SCLERA_LO.g - SCLERA_HI.g;
  const int SB = SCLERA_LO.b - SCLERA_HI.b;
  const int IR_R = IRIS_BASE.r, IR_G = IRIS_BASE.g, IR_B = IRIS_BASE.b;

  // A 32-bit integer divide is ~50 cycles on the C3 (RISC-V retires one
  // quotient bit per cycle) and this loop was doing four per pixel. Each is
  // now a multiply-shift, verified against the division it replaces to a max
  // error of 1 on a 0-255 scale:
  //
  //   x / 255       -> x >> 8
  //   dx * 256 / R  -> dx * INV_R_Q8 >> 8
  //   x * 255 / d   -> (x * 255 * RECIP(d)) >> 16
  const int INV_R_Q8 = 683;            // 256 / R, for dx*INV_R_Q8 >> 8
  const int RECIP_SHIFT = 16;
  // recip(d) = 65536 / d, guarded so a zero divisor cannot wrap to 0.
  #define EYE_RECIP(d) ((d) > 0 ? (1 << RECIP_SHIFT) / (d) : 1)
  const int RECIP_SPAN = EYE_RECIP(SIN_IRIS - SIN_PUPIL);
  #undef EYE_RECIP

  // ================= damage region =============
  // Only the iris and pupil move. Everything else in this frame is a fixed
  // function of (dx, dy) and the light: the sclera shading reads only
  // nx8/dy_lit/nz8/vert and the light coefficients, never FWD_X/Y/Z, so it
  // is byte-identical every frame. The highlights and brow are at fixed
  // screen positions. The background never changes.
  //
  // So the damage between two frames is exactly the union of where the iris
  // WAS and where it IS. Both must be repainted: the old position needs
  // sclera put back, the new one needs the iris.
  //
  // iris_box(): the limbus is the set of unit normals N with
  // N.F == cos(IRIS_ANGLE), i.e. N = cos(t)*F + sin(t)*u for any unit u
  // perpendicular to F. Projecting onto an axis, N.x spans
  //     cos(t)*F.x +/- sin(t)*sqrt(1 - F.x^2)
  // and screen x is R*N.x. That is a closed form, so no sqrtf per pixel and
  // no LUT. Checked against a brute-force scan of every pixel the renderer
  // emits, across all reachable gaze angles: it never misses.
  const float AIM_COS = cosf(IRIS_ANGLE * DEG);
  const float AIM_SIN = sinf(IRIS_ANGLE * DEG);

  auto iris_box = [&](float gy, float gp, int &bx0, int &by0, int &bx1, int &by1) {
    float ar = gy * DEG, pr = gp * DEG;
    float fx = sinf(ar) * cosf(pr), fy = sinf(pr);
    float hx = (float) R * AIM_SIN * sqrtf(1.0f - fx * fx);
    float hy = (float) R * AIM_SIN * sqrtf(1.0f - fy * fy);
    float mx = (float) CX + (float) R * AIM_COS * fx;
    float my = (float) CY + (float) R * AIM_COS * fy;
    bx0 = (int) floorf(mx - hx) - 1;
    by0 = (int) floorf(my - hy) - 1;
    bx1 = (int) ceilf(mx + hx) + 1;
    by1 = (int) ceilf(my + hy) + 1;
  };

  // The gaze of the previous drawn frame. Local statics rather than globals:
  // this is rendering bookkeeping, not animation state, and it is only
  // meaningful alongside have_drawn.
  static bool have_drawn = false;
  static float prev_yaw = 0.0f, prev_pitch = 0.0f;

  float gy = id(yaw), gp = id(pitch);

  // Nothing moved, so the frame would be pixel-identical. Return without
  // touching any pixel: the panel holds the previous frame and ESPHome
  // skips the transfer entirely, because leaving the watermarks unset makes
  // update() bail out before write_to_display_. The eye holds still for
  // GAZE_HOLD frames, so this skips most frames entirely.
  if (have_drawn && gy == prev_yaw && gp == prev_pitch)
    return;

  int x0, y0, x1, y1;
  if (have_drawn) {
    int ax0, ay0, ax1, ay1, bx0, by0, bx1, by1;
    iris_box(prev_yaw, prev_pitch, ax0, ay0, ax1, ay1);
    iris_box(gy, gp, bx0, by0, bx1, by1);
    x0 = ax0 < bx0 ? ax0 : bx0;
    y0 = ay0 < by0 ? ay0 : by0;
    x1 = ax1 > bx1 ? ax1 : bx1;
    y1 = ay1 > by1 ? ay1 : by1;
    // Clamp to the eyeball's bounding box. The iris cap always lies on the
    // disc, so this is defensive; it also keeps the rect inside the panel.
    // NOT applied on the first frame, where the brow and highlights sit
    // outside the eyeball and still have to be drawn.
    if (x0 < CX - R) x0 = CX - R;
    if (y0 < CY - R) y0 = CY - R;
    if (x1 > CX + R) x1 = CX + R;
    if (y1 > CY + R) y1 = CY + R;
  } else {
    // First frame: nothing is on the panel yet, so paint everything. The
    // brow sits above the eyeball, so this rect must not be clamped to it.
    x0 = 0; y0 = 0; x1 = 239; y1 = 239;
  }

  // ================= draw =====================
  // Background only on the first frame - it.fill() marks the WHOLE band
  // dirty, which is exactly what we are trying to stop doing every frame.
  // It is the MipiSpiBuffer override, a bulk std::fill_n over the band
  // buffer (~2 cycles/px); the base Display::fill() expands to
  // filled_rectangle() and routes every pixel through draw_pixel_at().
  if (!have_drawn)
    it.fill(SKIN);

  // Every pixel inside this rect is about to be written, which is what makes
  // it safe to hand ESPHome as the dirty region: the transfer covers exactly
  // the pixels we refreshed. Pixels in the rect but outside the disc are
  // left alone - they are background, and the buffer already holds SKIN
  // there from the first frame's fill.
  for (int y = y0; y <= y1; y++) {
    int dy = y - CY;
    int dy_sq = dy * dy;

    // Row-constants, hoisted out of the inner loop. ny8 in particular never
    // changes across a row.
    int ny8 = (dy * INV_R_Q8) >> 8;
    int dy_lit = ny8 * LIT_Y;
    int vert = (dy * VERTICAL_Q8) >> 8;

    for (int x = x0; x <= x1; x++) {
      int dx = x - CX;
      int r2 = dx * dx + dy_sq;
      if (r2 > R_SQ)
        continue;          // off the eyeball

      // Unit sphere normal at this pixel, Q8. nz8 is the table load that
      // stands in for the per-pixel sqrt.
      int nz8 = NZ_LUT[r2];
      int nx8 = (dx * INV_R_Q8) >> 8;

      // component along the eye's forward axis, Q8
      int along = (nx8 * FWD_X + ny8 * FWD_Y + nz8 * FWD_Z) >> 8;

      if (along > COS_IRIS) {
        // On the iris cap. `along` is the angle from the forward axis, so
        // the perpendicular component is fixed: across^2 = 1 - along^2.
        int a = along < 0 ? -along : along;
        if (a > 256) a = 256;
        int across8 = ACROSS_LUT[a];
        if (across8 < SIN_PUPIL) {
          it.draw_pixel_at(x, y, Color(0, 0, 0));
          continue;
        }
        // Radial position: 0 at the pupil edge, 255 at the limbus.
        int s8 = ((across8 - SIN_PUPIL) * 255 * RECIP_SPAN) >> RECIP_SHIFT;
        if (s8 < 0) s8 = 0;
        if (s8 > 255) s8 = 255;
        // smoothstep, so the iris holds its bright colour out past the pupil
        // before falling away rather than dimming linearly.
        s8 = (s8 * s8 * (768 - 2 * s8)) >> 16;
        // Invert: bright red at the pupil edge -> black at the limbus. This
        // doubles as limb darkening.
        int k = 255 - s8;
        it.draw_pixel_at(x, y,
                         Color((IR_R * k) >> 8, (IR_G * k) >> 8, (IR_B * k) >> 8));
        continue;
      }

      // Sclera: the same directional light on the same normal.
      int lit = (nx8 * LIT_X + dy_lit + nz8 * LIT_Z) >> 8;
      int t8 = 128 - (lit >> 1);
      if (t8 < 0) t8 = 0;
      if (t8 > 255) t8 = 255;
      t8 = (t8 * t8 * (768 - 2 * t8)) >> 16;   // smoothstep shoulder
      t8 += vert;
      if (t8 < 0) t8 = 0;
      if (t8 > 255) t8 = 255;
      it.draw_pixel_at(x, y,
                       Color(SCLERA_HI.r + ((SR * t8) >> 8),
                             SCLERA_HI.g + ((SG * t8) >> 8),
                             SCLERA_HI.b + ((SB * t8) >> 8)));
    }
  }

  // The static elements are drawn after the loop, so they sit on top of the
  // iris - which is what makes the big one read as a catchlight. They only
  // need redrawing when the iris repaint ran over them, otherwise they would
  // widen the dirty rect and drag the transfer back up.
  auto rect_overlaps = [&](int rx, int ry, int rw, int rh) {
    return !(x1 < rx || x0 > rx + rw - 1 || y1 < ry || y0 > ry + rh - 1);
  };

  // Specular highlights. Screen-fixed, and correctly so: rotating a sphere
  // about its own centre is visually a no-op, so a highlight on the ball
  // cannot move however the eye looks. Not following the iris is what sells
  // the eyeball as a physical ball rather than a disc with a picture on it.
  if (rect_overlaps(CX - 34, CY - 38, 17, 17))
    it.filled_circle(CX - 26, CY - 30, 8, WHITE);
  if (rect_overlaps(CX + 10, CY - 16, 9, 9))
    it.filled_circle(CX + 14, CY - 12, 4, WHITE);

  // brow, above the eyeball (top edge is 24)
  if (rect_overlaps(44, 5, 153, 8)) {
    for (int x = 48; x <= 192; x += 8) {
      float t = (float) (x - CX) / 72.0f;
      int y = 12 - (int) (7.0f * (1.0f - t * t));
      it.line(x - 4, y, x + 4, y, INK);
    }
  }

  prev_yaw = gy;
  prev_pitch = gp;
  have_drawn = true;