|-
  // =====================================================================
  // Cartoon eye for a 240x240 round GC9A01A.
  //
  // The eyeball is a sphere of radius R seen head-on. Every visible pixel has
  // a surface normal; the iris and pupil are two circles ON that sphere,
  // concentric about the eye's forward axis; the gaze is the angle between
  // that axis and the viewer.
  //
  // The whole eyeball is repainted every frame. There is no dirty region, and
  // the eye-local veins below rule one out anyway.
  //
  // CONSTRAINT: this build is SOFT-FLOAT, no FPU. Measured on target -
  //   sqrtf 6000 ns, float multiply 1800 ns (an FPU would be 1-4).
  // All per-pixel maths is therefore integer. Floats appear once per frame to
  // derive the gaze basis, and once at boot to bake the vein texture.
  // =====================================================================

  // ---- veins: COMPILE-TIME switch ----
  // MUST stay #if, not a runtime bool. VEIN_TEX is a static array, so it
  // occupies 37,249 B of .bss whether or not anything ever writes to it.
  #define EYE_VEINS 1

  // ================= tunables =================
  const float YAW_MAX   = 52.0f;
  const float PITCH_MAX = 38.0f;
  const int   GAZE_FRAMES  = 4;      // frames per saccade (90 ms each) = 360 ms
  const int   GAZE_HOLD_MIN = 8;     // 720 ms at 90 ms/frame
  const int   GAZE_HOLD_MAX = 55;    // 5.0 s
  // A held, near-centred stare is far more unnerving than a wander, and an eye
  // that only ever looks away reads as disengaged rather than watching.
  const float GAZE_STARE_CHANCE = 0.30f;
  const float GAZE_STARE_SPREAD = 7.0f;   // degrees either side of centre
  const int   GAZE_STARE_HOLD_MIN = 18;   // 1.6 s
  const int   GAZE_STARE_HOLD_MAX = 70;   // 6.3 s

  // Micro-tremor, in degrees. 1 degree is ~1.7 px of iris travel here, so this
  // is under a pixel: enough to shimmer, not enough to read as motion.
  //
  // The frequencies are in rad/frame and deliberately LOW. At update_interval
  // 200 ms the frame rate is 5 Hz, so Nyquist is 2.5 Hz - real 8-12 Hz tremor
  // is simply not representable and would alias into a visible slow beat.
  const float TREMOR_DEG = 0.30f;
  const float TREMOR_W1  = 1.63f;   // ~1.30 Hz at 5 fps
  const float TREMOR_W2  = 2.21f;   // ~1.76 Hz, incommensurate with W1

  // 30 deg puts the iris at ~60 px radius, so it spans half the globe, which is
  // close to a real eye (~11.7 mm across on a ~24 mm globe). The old 21 deg was
  // ~34 px - a cartoon proportion with a lot of white around the iris.
  const float IRIS_ANGLE = 30.0f;
  const float PUPIL_FRACTION = 0.50f;   // pupil radius as a fraction of iris
  const float SHADE_VERTICAL = 0.10f;    // extra darkening toward the bottom

  // Lid shadows. SCREEN-fixed, not eye-local: the lids belong to the head and
  // do not rotate with the globe. This is also the single biggest thing that
  // stops the lit hemisphere reading as one flat white disc.
  const float LID_UPPER_REACH = 0.62f;  // fraction of R to reach full strength
  const float LID_UPPER_STR   = 0.46f;
  const float LID_LOWER_START = 0.42f;  // fraction of R below centre
  const float LID_LOWER_REACH = 0.45f;
  const float LID_LOWER_STR   = 0.18f;

  // One catchlight on the cornea. Screen-fixed for the same reason the old
  // highlights were: the cornea is spherical, so its reflection of a fixed
  // light cannot move as the eye looks. Sits on the iris side of the cap
  // because the sclera is within 9 of white and a highlight there clips to
  // nothing - and a catchlight that fades when the eye turns away is correct.
  const int CORNEA_R     = 5;      // hard core
  const int CORNEA_BLOOM = 9;      // soft skirt
  const int CORNEA_BLOOM_PEAK = 70;

  // Lens flare, in pixels of the iris's own frame. Additive on top of the
  // iris shading, so it lifts toward white rather than changing hue.
  // PEAK scales both parts; it is not the value either one reaches. The streak
  // tops out at LEN*THICK*PEAK/256 and the core at CORE_SQ*PEAK/256. It was
  // 200 at the old 30/6/12 geometry, where those worked out to 140 and 112.
  // Scaling LEN and THICK up without scaling PEAK back down pushes the streak
  // to 390, which clamps into a flat grey bar rather than a flare.
  const int FLARE_PEAK   = 72;
  // Scaled with the iris: at 34 px these were 30/6/12, at 60 px they are the
  // same fraction of the cap.
  const int FLARE_LEN    = 50;      // half-length of the streak (iris is 60)
  const int FLARE_THICK  = 10;       // half-thickness of the streak
  const int FLARE_CORE   = 20;       // radius of the hot core
  const int FLARE_CORE_SQ = FLARE_CORE * FLARE_CORE;

  #if EYE_VEINS
  // Vessels are born on the far side of the globe, opposite the iris, and wrap
  // forward around it. Seen head-on, the only part of that run which is visible
  // is the outer band: near the silhouette the surface has already curved away
  // from the viewer and is heading for the back. So they are widest, darkest
  // and most crowded at the rim, and both width AND intensity taper away to
  // nothing by the limbus.
  const int   VEIN_ROOTS      = 11;
  // VEIN_STRENGTH is a tint toward VEIN_PALE/VEIN_DEEP, not an opacity over
  // the sclera, so the shading still shows through. It is applied to a GAMMA of
  // the baked amplitude: thickness does not map linearly to visual weight.
  const float VEIN_STRENGTH   = 0.95f;
  // Widest trunk. FALL_MAX follows from this - see the bake.
  //
  // WIDTH DOES NOT TAPER ALONG THE RUN. There used to be a radial taper here
  // as well as Murray's law at each fork, which double-counted: over four
  // generations a trunk reached 0.7 texel and vanished. Murray's law alone
  // gives 5.0 -> 4.0 -> 3.2 -> 2.5 -> 2.0, which is the taper we want, with
  // terminals still thick enough to see.
  const float VEIN_WIDTH_ROOT = 5.0f;
  const float VEIN_WIDTH_TIP  = 5.0f;
  // Nor does INTENSITY fade along the run, for the same reason. Vessels stop
  // where they stop; they do not dissolve. Legibility first.
  const int   VEIN_AMP_ROOT   = 255;
  const int   VEIN_AMP_TIP    = 255;
  // ---- tortuosity ----
  // THE defining feature. Vessels do not run straight; they weave, and the
  // weave is what makes them read as vessels rather than as scratches.
  // Modelled as the sum of two sine harmonics in the along-path parameter,
  // which is smooth BY CONSTRUCTION.
  //
  // Per-step random wander cannot do this and must not be reintroduced: noise
  // at the amplitude needed to be visible displaces the brush by more than its
  // own width between consecutive stamps, and the vessel breaks into a dotted
  // line. Low frequency is the whole point - that was the real lesson of the
  // drift bug, which cost several rounds because it looked like a density
  // problem.
  const float VEIN_TORT_A0    = 0.30f;   // radians
  const float VEIN_TORT_A1    = 0.12f;
  const float VEIN_TORT_F0    = 0.8f;    // cycles over the run
  const float VEIN_TORT_F1    = 1.9f;
  // Radial span of a trunk, in eye-local texels: ~48 is the limbus, ~96 the
  // silhouette. Roots start staggered within this band rather than all on one
  // circle, so they do not read as a set of spokes from a common origin.
  const float VEIN_RADIUS_OUT  = 100.0f;
  const float VEIN_RADIUS_IN   = 52.0f;
  // ---- the branching tree ----
  // Each vessel bifurcates ONCE, partway along, then becomes its two children.
  //
  // Depth 3, not 5. Depth was the wrong thing to maximise: at 5 the terminals
  // outnumber the trunks and the sclera fills with fine debris until the forks
  // stop reading. Three generations is where a trunk and its descendants are
  // still individually traceable, which is the whole point.
  const int   VEIN_DEPTH      = 3;
  // How hard the two children splay apart at a fork, as a multiplier on their
  // inherited meander amplitude. Zero gives a fork that is invisible because
  // the children run on top of each other.
  const float VEIN_FORK_SPLAY  = 1.5f;
  // Murray's law: r_parent^3 = sum of r_child^3, so a bifurcation gives each
  // child 1/2^(1/3) of the parent's radius. This is what makes a deep tree
  // AFFORDABLE, and it is why simply adding segments did not work before:
  // painted area goes as r^2, so as children shorten the ink per generation
  // falls rather than accumulating into mottle.
  const float VEIN_MURRAY2    = 0.7937005f;

  #endif

  // ---- iris fibres ----
  // Same compile-time-switch rule as EYE_VEINS: this array is in .bss whether
  // or not anything writes to it. Off by default because it is 9,409 B and the
  // full-frame display buffer needs one contiguous 115,200 B block.
  #define EYE_IRIS_FIBRES 1
  #if EYE_IRIS_FIBRES
  // Maps the eye-local Q8 coordinate out to the texture's 48-texel half-width.
  // At IRIS_ANGLE 30 the cap radius is sin(30)*256 = 128, and 128*96>>8 = 48,
  // so the whole cap is covered and the texture stays 97x97 whatever the angle.
  // Indexing it as (ldx>>1) instead would overflow the array at any angle over
  // ~25 deg.
  const int IRIS_TEX_SIDE = 97;
  const int IRIS_TEX_SCALE = 96;
  #endif

  // R = 120 inscribes the 240x240 panel exactly, so there is no margin and no
  // room for the brow below. The loop is inclusive of CY+R, which is y = 240 -
  // one past the last row. That one pixel is safe: draw_pixel_at range-checks
  // through get_clipping().inside(), so it is dropped rather than written.
  const int CX = 120, CY = 120, R = 120;
  const int R_SQ = R * R;
  #if EYE_VEINS
  // FIXED at 193, NOT 2*R+1. The vessel pattern is authored in eye-local
  // coordinates, so growing R must not grow the array: at R = 120 a 241-texel
  // square is 58,081 B, which is +20,832 B of .bss on a panel that already
  // needs one contiguous 115,200 B block. VEIN_TEX_MID is what the sample
  // index scales against, so these same 193 texels map to the same angles on
  // the sphere at any R - only the on-screen size of a vessel changes.
  const int VEIN_TEX_SIDE = 193;
  const int VEIN_TEX_MID  = 96;
  #endif

  Color SCLERA_HI(0xFF, 0xFD, 0xF6);    // brightest, facing the light
  // Shadow is warmer and more saturated, not merely darker white. A single
  // lerp to a darker SCLERA_HI cannot express that; this is the colour the
  // sclera shading actually resolves to at t8 = 255.
  Color SCLERA_LO(0xC4, 0xB4, 0xA2);    // shadowed, at the rim
  Color SKIN(0x14, 0x10, 0x18);         // backdrop
  Color IRIS_BASE(200, 45, 45);         // bright centre of the iris
  #if EYE_VEINS
  // Thicker vessels are paler, thinner ones deeper and darker - see the
  // amplitude-driven blend at the sample site.
  Color VEIN_PALE(0xC8, 0x3A, 0x38);    // capillary, bright red
  Color VEIN_DEEP(0x7A, 0x14, 0x1E);    // trunk, deep and near-purple
  #endif
  #if EYE_IRIS_FIBRES
  Color IRIS_FIBRE    (222, 150, 88);   // stroma fibres, lighter
  Color IRIS_FIBRE_DK ( 60,  12, 12);   // crypts, darker
  #endif

  #if EYE_VEINS
  // ================= vein texture ================
  // Baked ONCE at boot. The LCG below is seeded from hardware entropy, so the
  // vessel layout differs on every boot - only the LCG itself is fixed.
  static uint8_t VEIN_TEX[VEIN_TEX_SIDE * VEIN_TEX_SIDE];
  static bool veins_built = false;
  if (!veins_built) {
    veins_built = true;
    const int S = VEIN_TEX_SIDE;
    const float MID = (float) VEIN_TEX_MID;

    // A zero seed is NOT a fixed point here - next(0) = 12345 - so no guard.
    uint32_t seed = esphome::random_uint32();
    auto rnd = [&]() {
      seed = (1103515245u * seed + 12345u) & 0x7FFFFFFFu;
      return (float) seed * (1.0f / 2147483648.0f);
    };

    // Falloff indexed by squared distance: ~160 sqrtf here instead of ~34k.
    //
    // fall[] reaches zero exactly at r = VEIN_WIDTH_ROOT, so this MUST track
    // it: FALL_MAX > 16 * VEIN_WIDTH_ROOT^2. Hardcoding 164 while the width
    // was 3.2 happened to agree (16*3.2*3.2 = 163.8); raising the width
    // without raising this silently truncates every trunk at the old radius
    // instead of widening it. 420 covers the root width of 5.0: fall[] reaches
    // zero at 16*5.0*5.0 = 400, so FALL_MAX must EXCEED that, not merely reach
    // it, or the brush is cut off mid-falloff and the trunk gets a hard rim.
    // It cannot be derived in a constant expression here because the enclosing
    // const float is not constexpr under ESPHome's lambda wrapper.
    // uint8_t, not int: the values are 0..255 and this is boot stack.
    const int FALL_MAX = 420;
    uint8_t fall[FALL_MAX];
    for (int i = 0; i < FALL_MAX; i++) {
      int v = (int) (255.0f * (1.0f - sqrtf((float) i * (1.0f / 16.0f)) / VEIN_WIDTH_ROOT));
      fall[i] = (uint8_t) (v < 0 ? 0 : v);
    }

    // The brush is INTEGER, in 1/16 px units. In float it would be two
    // multiplies per candidate pixel, and at 1800 ns each that is the whole
    // difference between ~30 ms and ~330 ms of boot time for a one-time
    // texture this board will never rebuild.
    //
    // d2 is squared distance in pixels times 16 - the index the falloff table
    // is built against. ex*ex + ey*ey peaks at 8192, no overflow concern.
    auto stamp = [&](float fx, float fy, float w, int amp) {
      int cxi = (int) (fx * 16.0f), cyi = (int) (fy * 16.0f);
      int bw = (int) (w * 16.0f) + 16;
      // fall[] is built for VEIN_WIDTH_ROOT, but this brush is only w wide, so
      // the index is rescaled by (ROOT/w)^2. WITHOUT this every stamp paints a
      // disc of VEIN_WIDTH_ROOT radius however thin the vessel is - the taper
      // in w does nothing - and at a root width of 3.2 that is a 6.4 px band
      // per vessel. Seven of those merge into a pink wash instead of resolving
      // into threads, which is what made the set read as a rash.
      int sc = (int) ((VEIN_WIDTH_ROOT * VEIN_WIDTH_ROOT * 256.0f) / (w * w));
      for (int yy = (cyi - bw) >> 4; yy <= (cyi + bw) >> 4; yy++) {
        if (yy < 0 || yy >= S) continue;
        int ey = (yy << 4) + 8 - cyi;
        int ey2 = ey * ey;
        for (int xx = (cxi - bw) >> 4; xx <= (cxi + bw) >> 4; xx++) {
          if (xx < 0 || xx >= S) continue;
          int ex = (xx << 4) + 8 - cxi;
          int d2 = (ex * ex + ey2) >> 4;
          // >= , not >: fall has FALL_MAX entries, valid indices 0..FALL_MAX-1.
          // Letting FALL_MAX through reads past the end of the array.
          int di = (d2 * sc) >> 8;
          if (di >= FALL_MAX) continue;
          int v = (amp * fall[di]) / 255;
          uint8_t &cell = VEIN_TEX[yy * S + xx];
          if (v > cell) cell = (uint8_t) v;
        }
      }
    };

    // Walk vessels from the rim inward, bifurcating as we go. An explicit
    // worklist rather than recursion, so there is no depth limit to reason
    // about and no std::function overhead per step.
    //
    // The path is a SUM OF TWO SINE HARMONICS in the along-path parameter, not
    // a straight line with noise on it. That is the single change that makes
    // these read as vessels: reference sclera is dominated by meander, and a
    // radial run - however jittered - reads as a spoke. The harmonics are
    // smooth by construction, which per-step random wander is not.
    struct VSeg {
      float ang, r0, r1, w0, w1, a0, a1;
      float t_a0, t_a1, t_f0, t_f1, t_p0, t_p1;
      int depth;
    };
    VSeg stack[64];
    int sp = 0;
    for (int i = 0; i < VEIN_ROOTS; i++) {
      VSeg &v = stack[sp++];
      v.ang = rnd() * 6.2831853f;
      // Start staggered WITHIN the radial band, not all on one circle. Roots
      // sharing a start radius share an origin, and a set of things leaving a
      // common origin is a starburst however much each one wanders.
      v.r0 = VEIN_RADIUS_OUT * (0.80f + 0.20f * rnd());
      v.r1 = VEIN_RADIUS_IN + (rnd() - 0.5f) * 12.0f;
      v.w0 = VEIN_WIDTH_ROOT * (0.80f + 0.20f * rnd());
      v.w1 = VEIN_WIDTH_TIP;
      v.a0 = VEIN_AMP_ROOT;
      v.a1 = VEIN_AMP_TIP;
      // Two harmonics, each with its own amplitude, frequency and phase.
      v.t_a0 = VEIN_TORT_A0 * (0.7f + 0.6f * rnd());
      v.t_a1 = VEIN_TORT_A1 * (0.4f + 0.8f * rnd());
      v.t_f0 = VEIN_TORT_F0 * (0.7f + 0.6f * rnd());
      v.t_f1 = VEIN_TORT_F1 * (0.7f + 0.6f * rnd());
      v.t_p0 = rnd() * 6.2831853f;
      v.t_p1 = rnd() * 6.2831853f;
      v.depth = VEIN_DEPTH;
    }
    while (sp > 0) {
      VSeg s = stack[--sp];
      // r0 > r1, so this must be r0 - r1; the reverse makes steps negative and
      // the guard below skips every vessel, baking an empty texture silently.
      float span = s.r0 - s.r1;
      // 6 samples per texel of span, not 2. The path is curved, so consecutive
      // stamps separate laterally as well as radially; at 2 the thin inner ends
      // came out visibly beaded.
      int steps = (int) (span * 6.0f);
      if (steps <= 0) continue;
      // Split late-ish and over a WIDE range. A fixed fraction made every fork
      // land at the same relative depth, which reads as a herringbone, not a
      // tree.
      int split_at = (int) ((float) steps * (0.30f + 0.45f * rnd()));
      if (split_at < 1) split_at = 1;
      if (split_at > steps - 1) split_at = steps - 1;
      for (int i = 0; i <= steps; i++) {
        float t = (float) i / (float) steps;
        // The path: two harmonics, summed. Smooth by construction, so the brush
        // never leaves the line - which is exactly what per-step noise did.
        float ang = s.ang
                    + s.t_a0 * sinf(6.2831853f * s.t_f0 * t + s.t_p0)
                    + s.t_a1 * sinf(6.2831853f * s.t_f1 * t + s.t_p1);
        float r = s.r0 + (s.r1 - s.r0) * t;
        float w = s.w0 + (s.w1 - s.w0) * t;
        float a = s.a0 + (s.a1 - s.a0) * t;
        stamp(MID + r * cosf(ang), MID + r * sinf(ang), w, (int) (a + 0.5f));
        if (s.depth > 0 && i == split_at && sp < 52) {
          // Murray's law: each child gets 1/2^(1/3) of the parent's radius.
          float cw = w * VEIN_MURRAY2;
          for (int k = 0; k < 2; k++) {
            VSeg c = s;
            c.r0 = r;
            // Terminals must NOT all crawl to the limbus. With a fixed
            // fraction of the remaining span, every descendant of every root
            // ended in the same narrow annulus and they piled into a granular
            // ring there. A wide random fraction scatters the termini over the
            // whole sclera, which is both truer and far more legible.
            c.r1 = r - span * (0.18f + 0.42f * rnd());
            // Murray's law already produces the width hierarchy, so the run is
            // UNIFORM width: no further radial taper. Terminals stay blunt.
            c.w0 = cw; c.w1 = cw;
            // Likewise no intensity fade along the run. A vessel stops where
            // it stops; it does not dissolve before it gets there.
            c.a0 = a; c.a1 = a;
            // CONTINUITY IS THE WHOLE GAME HERE.
            //
            // The path angle is ang0 + amp*sin(2*pi*f*t + phase). A child that
            // inherited a RANDOM phase therefore starts at an angle unrelated
            // to where its parent had reached - measured at up to 52 texels
            // away at r = 80. Children then do not emanate from the fork at all;
            // they land elsewhere, cross each other, and the set renders as
            // criss-crossed hatching instead of a tree. That was the banding in
            // the sandbox, not the brush or the sampling.
            //
            // Zero phase fixes it: sin(0) = 0, so with c.ang = the parent's
            // current angle the child begins exactly at the fork and its
            // meander grows from there. Opposite amplitude signs send the two
            // children to either side, which is what makes it read as a Y, and
            // VEIN_FORK_SPLAY sets how hard they pull apart - at the parent's
            // own amplitude the two children run almost parallel for their
            // whole short run and the fork closes up again into a thick line.
            c.ang = ang;
            c.t_p0 = 0.0f;
            c.t_p1 = 0.0f;
            float sgn = (k == 0) ? 1.0f : -1.0f;
            c.t_a0 = s.t_a0 * (0.9f + 0.6f * rnd()) * sgn * VEIN_FORK_SPLAY;
            c.t_a1 = s.t_a1 * (0.9f + 0.6f * rnd()) * VEIN_FORK_SPLAY;
            c.t_f0 = s.t_f0 * (0.8f + 0.5f * rnd());
            c.t_f1 = s.t_f1 * (0.8f + 0.5f * rnd());
            c.depth = s.depth - 1;
            stack[sp++] = c;
          }
          // This vessel IS its two children now; carrying on as well would
          // make three, and the ink budget assumes a binary split.
          break;
        }
      }
    }
  }
  #endif

  #if EYE_IRIS_FIBRES
  // ================= iris fibre texture ================
  // Baked once, like the veins. Stored biased at 128 so one array carries both
  // stroma fibres (above) and crypts (below) with no second channel.
  //
  // Indexed in eye-local Q8 shifted down by one, so the sampling index is
  // (ldx>>1)+48. On the iris cap |ldx| <= sin(IRIS_ANGLE)*256 = 91, which
  // gives 2..94 inside 97. Deliberately cartesian rather than polar: a polar
  // LUT would be ~1.5 KB instead of 9.4 KB, but it needs an atan2 per cap
  // pixel, and the cap is only ~3,600 px. Revisit only if 9,409 B of .bss ever
  // becomes the binding constraint.
  static uint8_t IRIS_TEX[IRIS_TEX_SIDE * IRIS_TEX_SIDE];
  static bool iris_built = false;
  if (!iris_built) {
    iris_built = true;
    const int IS = IRIS_TEX_SIDE;
    const float IMID = (float) (IS / 2);
    const float IRAD = (float) (IS / 2 - 1);   // usable radius in texels

    for (int i = 0; i < IS * IS; i++) IRIS_TEX[i] = 128;

    uint32_t iseed = 7717u;
    auto irnd = [&]() {
      iseed = (1103515245u * iseed + 12345u) & 0x7FFFFFFFu;
      return (float) iseed * (1.0f / 2147483648.0f);
    };

    // Same brush shape as the veins: parabolic falloff, radius w, kept as the
    // extreme toward `target`. Lighten keeps the max, darken the min.
    auto mark = [&](float fx, float fy, float w, int target, bool lighten) {
      float rr = w * w;
      for (int yy = (int) (fy - w) - 1; yy <= (int) (fy + w) + 1; yy++) {
        if (yy < 0 || yy >= IS) continue;
        for (int xx = (int) (fx - w) - 1; xx <= (int) (fx + w) + 1; xx++) {
          if (xx < 0 || xx >= IS) continue;
          float ex = (float) xx - fx, eyy = (float) yy - fy;
          float d2 = ex * ex + eyy * eyy;
          if (d2 >= rr) continue;
          float a = 1.0f - sqrtf(d2) / w;
          uint8_t &cell = IRIS_TEX[yy * IS + xx];
          int v = lighten ? (int) (128.0f + a * (float) (target - 128))
                          : (int) (128.0f - a * (float) (128 - target));
          if (v < 0) v = 0;
          if (v > 255) v = 255;
          if (lighten ? (v > cell) : (v < cell)) cell = (uint8_t) v;
        }
      }
    };

    // Stroma fibres: radial, from just outside the pupil to the limbus, each
    // wandering a little so they are not spokes.
    //
    // Step size and wander are coupled for the same reason as the veins: 0.10
    // rad per step is ~4 texels of sideways jump out at the iris rim, which
    // leaves a field of dots rather than radial fibres.
    const int FIBRES = 80;
    const float FR_IN  = IRAD * 0.30f;    // pupil edge
    const float FR_OUT = IRAD * 0.96f;    // just inside the limbal ring
    for (int i = 0; i < FIBRES; i++) {
      float ang = 6.2831853f * ((float) i + irnd()) / (float) FIBRES;
      float bright = 0.35f + 0.65f * irnd();
      int steps = (int) ((FR_OUT - FR_IN) * 2.0f);   // ~0.5 texel steps
      // Wider than the vessels' nominal width: at 1 texel the line staircases
      // into dashes because nothing here is antialiased.
      float w = 1.6f + 0.8f * irnd();
      for (int k = 0; k <= steps; k++) {
        float t = (float) k / (float) steps;
        ang += (irnd() - 0.5f) * 0.012f;
        float r = FR_IN + (FR_OUT - FR_IN) * t;
        mark(IMID + r * cosf(ang), IMID + r * sinf(ang), w,
             (int) (128.0f + 92.0f * bright), true);
      }
    }

    // Collarette: the raised ruff at roughly a third of the iris radius. It is
    // a RING, so it is stamped around a circle - filling a disc there just
    // paints a blob over the pupil margin.
    {
      const float CR = IRAD * 0.36f;
      const int CN = 220;
      for (int i = 0; i < CN; i++) {
        float a = 6.2831853f * (float) i / (float) CN;
        mark(IMID + CR * cosf(a), IMID + CR * sinf(a), 1.8f, 172, true);
      }
    }

    // Crypts: small dark pits clustered just outside the pupil margin.
    for (int i = 0; i < 26; i++) {
      float ang = 6.2831853f * irnd();
      float r = FR_IN + (FR_OUT - FR_IN) * (0.08f + 0.42f * irnd());
      mark(IMID + r * cosf(ang), IMID + r * sinf(ang), 1.4f + 1.6f * irnd(), 96, false);
    }

    // Limbal ring: the dark band where the iris meets the sclera.
    for (int yy = 0; yy < IS; yy++) {
      for (int xx = 0; xx < IS; xx++) {
        float ex = (float) xx - IMID, ey = (float) yy - IMID;
        float r = sqrtf(ex * ex + ey * ey) / IRAD;
        if (r > 0.86f) {
          float a = r - 0.86f;
          if (a > 1.0f) a = 1.0f;
          uint8_t &cell = IRIS_TEX[yy * IS + xx];
          int v = (int) (128.0f - 76.0f * a);
          if (v < cell) cell = (uint8_t) v;
        }
      }
    }
  }
  #endif

  // ================= lookup tables =================
  // Pure functions of compile-time constants, so these are built once. This is
  // 9,474 sqrtf; left in the per-frame path it dominated the lambda.
  //
  // Q8 encodes 1.0 as 256, which does NOT fit a uint8_t. NZ_LUT hits 256 at
  // r2=0 and ACROSS_LUT at a=0; casting straight to uint8_t wraps both to 0.
  // With nz=0 the centre pixels compute along=0, fall below COS_IRIS, and
  // shade as mid-grey sclera. Hence EYE_Q8.
  static uint8_t NZ_LUT[R_SQ + 1];
  static uint8_t ACROSS_LUT[257];
  static bool luts_built = false;
  if (!luts_built) {
    luts_built = true;
    #define EYE_Q8(v) ((uint8_t) ((v) > 255 ? 255 : (int) (v)))
    for (int32_t r2 = 0; r2 <= R_SQ; r2++)
      NZ_LUT[r2] = EYE_Q8(sqrtf((float) (R_SQ - r2)) * 256.0f / (float) R + 0.5f);
    for (int a = 0; a <= 256; a++)
      ACROSS_LUT[a] = EYE_Q8(sqrtf(1.0f - ((float) a / 256.0f) * ((float) a / 256.0f)) * 256.0f + 0.5f);
    #undef EYE_Q8
  }

  // ================= per-band bookkeeping =================
  // first_band is always true under a full-frame buffer. It guards against
  // mipi_spi banding, which the lambda cannot detect - see eye-device.yaml.
  Rect clip = it.get_clipping();
  bool has_clip = clip.is_set();
  bool first_band = !has_clip || (clip.y == 0);

  // ================= gaze ====================
  // GAZE_FRAMES is the smoothness lever, not update_interval: the state
  // machine renders at t = 1/F, 2/F ... 1.0, so F=2 gives a single midpoint
  // and smoothstep(0.5) is exactly 0.5 - a straight linear two-step jump.
  // Without the first_band gate this runs once per band and the gaze advances
  // several times per displayed frame.
  if (first_band && id(gmove) > 0) {
    id(gmove)--;
    float t = 1.0f - (float) id(gmove) / (float) GAZE_FRAMES;
    t = t * t * (3.0f - 2.0f * t);
    id(yaw)   = id(yaw_s)   + (id(yaw_t)   - id(yaw_s))   * t;
    id(pitch) = id(pitch_s) + (id(pitch_t) - id(pitch_s)) * t;
  } else if (first_band && id(ghold) > 0) {
    id(ghold)--;
  } else if (first_band) {
    id(yaw_s)   = id(yaw);
    id(pitch_s) = id(pitch);
    id(gmove) = GAZE_FRAMES;
    if (esphome::random_float() < GAZE_STARE_CHANCE) {
      id(yaw_t)   = (esphome::random_float() - 0.5f) * 2.0f * GAZE_STARE_SPREAD;
      id(pitch_t) = (esphome::random_float() - 0.5f) * 2.0f * GAZE_STARE_SPREAD;
      id(ghold) = GAZE_STARE_HOLD_MIN +
                  (int) (esphome::random_float() * (float) (GAZE_STARE_HOLD_MAX - GAZE_STARE_HOLD_MIN));
    } else {
      float ang = esphome::random_float() * 6.2831853f;
      float rad = sqrtf(esphome::random_float());
      id(yaw_t)   = cosf(ang) * rad * YAW_MAX;
      id(pitch_t) = sinf(ang) * rad * PITCH_MAX;
      id(ghold) = GAZE_HOLD_MIN +
                  (int) (esphome::random_float() * (float) (GAZE_HOLD_MAX - GAZE_HOLD_MIN));
    }
  }

  // ================= micro-tremor =================
  // A perfectly still eye reads as a dead object. Added as a RENDER-ONLY
  // offset: folding it back into id(yaw)/id(pitch) would make the gaze
  // random-walk off the globe over time.
  if (first_band) id(frame)++;
  const float tf = (float) id(frame);
  const float yaw_trem = (sinf(tf * TREMOR_W1) + 0.55f * sinf(tf * TREMOR_W2 + 1.7f)) * TREMOR_DEG;
  const float pit_trem = (sinf(tf * TREMOR_W2 + 2.3f) + 0.55f * sinf(tf * TREMOR_W1)) * TREMOR_DEG;

  // ================= the eye's frame =================
  const float DEG = 0.0174532925f;
  const float yaw_rad = (id(yaw) + yaw_trem) * DEG;
  const float pitch_rad = (id(pitch) + pit_trem) * DEG;
  const float cyw = cosf(yaw_rad), syw = sinf(yaw_rad);
  const float cpt = cosf(pitch_rad), spt = sinf(pitch_rad);

  // eye-local basis in screen space (x right, y down, z toward viewer)
  const float fwd_x = syw * cpt, fwd_y = spt,     fwd_z = cyw * cpt;
  const float rgt_x = cyw,          rgt_y = 0.0f, rgt_z = -syw;
  // up = fwd x rgt. The -cyw*spt sign is what makes this orthonormal: with
  // +cyw*spt instead, up.fwd = sin(pitch)*cos(pitch), which is 0.485 at
  // pitch 38, a badly skewed basis.
  const float up_x  = -syw * spt,    up_y  = cpt,   up_z  = -cyw * spt;

  // Q8 for the integer loop
  const int FWD_X = (int) (fwd_x * 256.0f);
  const int FWD_Y = (int) (fwd_y * 256.0f);
  const int FWD_Z = (int) (fwd_z * 256.0f);
  const int RGT_X = (int) (rgt_x * 256.0f);
  const int RGT_Y = (int) (rgt_y * 256.0f);
  const int RGT_Z = (int) (rgt_z * 256.0f);
  const int UP_X  = (int) (up_x  * 256.0f);
  const int UP_Y  = (int) (up_y  * 256.0f);
  const int UP_Z  = (int) (up_z  * 256.0f);

  const int COS_IRIS = (int) (cosf(IRIS_ANGLE * DEG) * 256.0f);
  const int SIN_IRIS = (int) (sinf(IRIS_ANGLE * DEG) * 256.0f);
  const int SIN_PUPIL = (int) (PUPIL_FRACTION * (float) SIN_IRIS);

  // Fixed directional light, upper left.
  const int LIT_X = (int) (-0.55f * 256.0f);
  const int LIT_Y = (int) (-0.45f * 256.0f);
  const int LIT_Z = (int) (0.70f * 256.0f);
  const int VERTICAL_Q8 = (int) (SHADE_VERTICAL * 256.0f);

  // Lid ramp numerators: (255<<8) / reach-in-pixels, so `dist * NUM >> 8`
  // reaches 255 exactly at the reach and the caller just clamps beyond it.
  // Written as a ratio rather than a per-pixel scale because the Q8 scale
  // itself truncates to 1 at these radii, which silently yields zero shade.
  const int LID_UP_NUM = (255 << 8) / (int) (LID_UPPER_REACH * R);
  const int LID_LO_NUM = (255 << 8) / (int) (LID_LOWER_REACH * R);
  const int LID_LO_OFF = (int) (LID_LOWER_START * R);
  const int LID_UP_S_Q8 = (int) (LID_UPPER_STR * 256.0f);
  const int LID_LO_S_Q8 = (int) (LID_LOWER_STR * 256.0f);

  // Placed on the IRIS, not the pupil. Scaled to the iris it lands ~40 px out,
  // between the pupil edge (30) and the limbus (60); on the pupil the same
  // additive white has no base to lift and blows out into a headlight.
  const int CORNEA_X = CX - 27, CORNEA_Y = CY - 30;
  const int CORNEA_CORE_SQ = CORNEA_R * CORNEA_R;
  const int CORNEA_CORE_K  = (255 << 16) / CORNEA_CORE_SQ;
  const int CORNEA_BLOOM_SQ = CORNEA_BLOOM * CORNEA_BLOOM;
  const int CORNEA_BLOOM_K = (CORNEA_BLOOM_PEAK << 16) / CORNEA_BLOOM_SQ;

  const int SR = SCLERA_LO.r - SCLERA_HI.r;
  const int SG = SCLERA_LO.g - SCLERA_HI.g;
  const int SB = SCLERA_LO.b - SCLERA_HI.b;
  const int IR_R = IRIS_BASE.r, IR_G = IRIS_BASE.g, IR_B = IRIS_BASE.b;

  #if EYE_VEINS
  const int VEIN_STRENGTH_Q8 = (int) (VEIN_STRENGTH * 256.0f);
  #endif

  // A 32-bit integer divide is ~50 cycles on the C3 and this loop would do
  // four per pixel. Each is a multiply-shift instead, verified against the
  // division it replaces to a max error of 1 on a 0-255 scale.
  // 65536/R, i.e. 256/R in Q8: (dx * INV_R_Q8) >> 8 == dx/R*256. MUST be
  // recomputed whenever R changes - at 683 (= 65536/96) with R = 120 the
  // normal is 25% too large everywhere and the sphere flattens.
  const int INV_R_Q8 = 546;            // 65536 / 120
  const int RECIP_SHIFT = 16;
  #define EYE_RECIP(d) ((d) > 0 ? (1 << RECIP_SHIFT) / (d) : 1)
  const int RECIP_SPAN = EYE_RECIP(SIN_IRIS - SIN_PUPIL);
  #undef EYE_RECIP
  

  // ================= draw =====================
  // Background via it.fill(), which MipiSpiBuffer OVERRIDES with a bulk
  // std::fill_n over the band buffer (~2 cycles/px).
  it.fill(SKIN);

  for (int y = CY - R; y <= CY + R; y++) {
    int dy = y - CY;
    int dy_sq = dy * dy;

    // Row-constants, hoisted out of the inner loop.
    int ny8 = (dy * INV_R_Q8) >> 8;
    int dy_lit = ny8 * LIT_Y;
    int vert = (dy * VERTICAL_Q8) >> 8;

    // Lid shading, hoisted per row: it depends on y only.
    // Upper lid grows toward the top edge, eased so it does not terminate on
    // a hard line at y = CY; the lower lid is weaker and starts further out,
    // because anatomically it sits below the equator.
    int lid = ((CY - y) * LID_UP_NUM) >> 8;
    if (lid < 0) lid = 0;
    if (lid > 255) lid = 255;
    lid = (lid * lid * (768 - 2 * lid)) >> 16;
    int lid2 = ((y - CY - LID_LO_OFF) * LID_LO_NUM) >> 8;
    if (lid2 < 0) lid2 = 0;
    if (lid2 > 255) lid2 = 255;
    lid2 = (lid2 * lid2 * (768 - 2 * lid2)) >> 16;
    int lid_shade = ((lid * LID_UP_S_Q8) >> 8) + ((lid2 * LID_LO_S_Q8) >> 8);

    for (int x = CX - R; x <= CX + R; x++) {
      int dx = x - CX;
      int r2 = dx * dx + dy_sq;
      if (r2 > R_SQ)
        continue;                       // off the eyeball

      int nz8 = NZ_LUT[r2];
      int nx8 = (dx * INV_R_Q8) >> 8;

      int along = (nx8 * FWD_X + ny8 * FWD_Y + nz8 * FWD_Z) >> 8;

      // Surface coordinate in the eye's own frame, shared by the iris flare
      // and the scleral veins. Projecting the world normal onto the eye's
      // right/up axes is what makes both travel with the globe as it turns.
      //
      // The >> 8 is NOT optional: nx8 and RGT_X are both Q8, so the product
      // is Q16. Without it every index lands outside the 193x193 texture and
      // the bounds check rejects all of them - the eye renders with no veins.
      //
      // dot(fwd, rgt) and dot(fwd, up) are both exactly 0, so this origin is
      // the iris centre, not the eye centre, and a point on the cap sits at a
      // screen radius of l * R / 256.
      int ldx = (nx8 * RGT_X + ny8 * RGT_Y + nz8 * RGT_Z) >> 8;
      int ldy = (nx8 * UP_X + ny8 * UP_Y + nz8 * UP_Z) >> 8;

      int rr = 0, rg = 0, rb = 0;
      if (along > COS_IRIS) {
        // On the iris cap. `along` is the angle from the forward axis, so
        // the perpendicular component is fixed: across^2 = 1 - along^2.
        int a = along < 0 ? -along : along;
        if (a > 256) a = 256;
        int across8 = ACROSS_LUT[a];

        // ---- lens flare ----
        // An anamorphic streak through the iris plus a hot core up-left, to
        // agree with LIT_X / LIT_Y. Iris-local, so it turns with the gaze.
        int flx = (ldx * R) >> 8;
        int fly = (ldy * R) >> 8;
        int ax = flx < 0 ? -flx : flx;
        int ay = fly < 0 ? -fly : fly;

        // Streak: product of the two remaining extents, giving a parabolic
        // cross-section that reaches zero exactly at LEN / THICK. The >> 8 is
        // the scaling; peak is LEN*THICK*PEAK/256.
        int fl = 0;
        if (ax < FLARE_LEN && ay < FLARE_THICK)
          fl = ((FLARE_LEN - ax) * (FLARE_THICK - ay) * FLARE_PEAK) >> 8;

        // (16, 13) is LIT_X,LIT_Y scaled to ~20 px, so the core sits on the key
        // light. Was (9, 7) at the old core radius; leaving it there pins the
        // core just off the pupil edge and pushes its rim past the iris.
        int dcx = flx + 16, dcy = fly + 13;
        int dc2 = dcx * dcx + dcy * dcy;
        if (dc2 < FLARE_CORE_SQ) {
          int fc = ((FLARE_CORE_SQ - dc2) * FLARE_PEAK) >> 8;
          if (fc > fl) fl = fc;
        }

        // rr/rg/rb start black - that is the pupil - and take the iris
        // shading outside it. The flare is then added on top of BOTH: it is
        // glare on the front surface, so it crosses the pupil rather than
        // stopping at its edge. Applying it after the pupil test buries its
        // peak in a 17 px black disc.
        if (across8 >= SIN_PUPIL) {
          int s8 = ((across8 - SIN_PUPIL) * 255 * RECIP_SPAN) >> RECIP_SHIFT;
          if (s8 < 0) s8 = 0;
          if (s8 > 255) s8 = 255;
          s8 = (s8 * s8 * (768 - 2 * s8)) >> 16;
          int k = 255 - s8;
          rr = (IR_R * k) >> 8;
          rg = (IR_G * k) >> 8;
          rb = (IR_B * k) >> 8;

        #if EYE_IRIS_FIBRES
          // Fibre/crypt detail, signed around the baked 128 bias.
          int ix = ((ldx * IRIS_TEX_SCALE) >> 8) + (IRIS_TEX_SIDE / 2);
          int iy = ((ldy * IRIS_TEX_SCALE) >> 8) + (IRIS_TEX_SIDE / 2);
          if ((unsigned) ix < IRIS_TEX_SIDE && (unsigned) iy < IRIS_TEX_SIDE) {
            int f = (int) IRIS_TEX[iy * IRIS_TEX_SIDE + ix] - 128;
            if (f > 0) {
              rr += ((IRIS_FIBRE.r - rr) * f) >> 7;
              rg += ((IRIS_FIBRE.g - rg) * f) >> 7;
              rb += ((IRIS_FIBRE.b - rb) * f) >> 7;
            } else if (f < 0) {
              int d = -f;
              rr += ((IRIS_FIBRE_DK.r - rr) * d) >> 7;
              rg += ((IRIS_FIBRE_DK.g - rg) * d) >> 7;
              rb += ((IRIS_FIBRE_DK.b - rb) * d) >> 7;
            }
          }
        #endif
        }
        rr += fl; if (rr > 255) rr = 255;
        rg += fl; if (rg > 255) rg = 255;
        rb += fl; if (rb > 255) rb = 255;
      } else {
        // ---- sclera ----
        int lit = (nx8 * LIT_X + dy_lit + nz8 * LIT_Z) >> 8;
        int t8 = 128 - (lit >> 1);
        if (t8 < 0) t8 = 0;
        if (t8 > 255) t8 = 255;
        // Half-strength shoulder. A full smoothstep has zero derivative at
        // t8 = 0, which is the LIT end, so it crushed the whole lit hemisphere
        // into a flat near-white disc. Blending 50/50 with the linear term
        // restores the slope there and still eases the terminator.
        t8 = (((t8 * t8 * (768 - 2 * t8)) >> 16) + t8) >> 1;
        t8 += vert + lid_shade;
        if (t8 < 0) t8 = 0;
        if (t8 > 255) t8 = 255;
        rr = SCLERA_HI.r + ((SR * t8) >> 8);
        rg = SCLERA_HI.g + ((SG * t8) >> 8);
        rb = SCLERA_HI.b + ((SB * t8) >> 8);

    #if EYE_VEINS
        // ---- veins ----
        // Scales the eye-local Q8 coordinate onto the FIXED 193-texel vein texture.
        // Using R here instead is correct-but-expensive: it would index past a
        // 193-texel array the moment R exceeded 96.
        int tx = ((ldx * VEIN_TEX_MID) >> 8) + VEIN_TEX_MID;
        int ty = ((ldy * VEIN_TEX_MID) >> 8) + VEIN_TEX_MID;
        if ((unsigned) tx < VEIN_TEX_SIDE && (unsigned) ty < VEIN_TEX_SIDE) {
          int v = VEIN_TEX[ty * VEIN_TEX_SIDE + tx];
          if (v) {
            // Gamma the tint. Baked amplitude is a brush falloff, so it is
            // linear in radius; visual weight is not. Without this a 1 px
            // capillary lands as strong a mark as a 4 px trunk and the set
            // reads as printed-on rather than lying under the surface.
            int g = (v * (v + 255)) >> 9;        // ~v^1.5, 0..255
            // No radial fade. A previous version faded the tint to zero at the
            // rim, on the theory that vessels recede around the globe - but
            // that is precisely the outer band the density belongs in, and
            // removing it is what finally made the set read as wrapping the
            // eyeball rather than radiating off the iris.
            int amt = (g * VEIN_STRENGTH_Q8) >> 8;
            // Thicker vessels carry more blood and sit deeper, so they run
            // darker and cooler. Same amplitude drives the colour, which is
            // why this costs no second channel.
            int vr = VEIN_PALE.r + (((VEIN_DEEP.r - VEIN_PALE.r) * g) >> 8);
            int vg = VEIN_PALE.g + (((VEIN_DEEP.g - VEIN_PALE.g) * g) >> 8);
            int vb = VEIN_PALE.b + (((VEIN_DEEP.b - VEIN_PALE.b) * g) >> 8);
            rr += ((vr - rr) * amt) >> 8;
            rg += ((vg - rg) * amt) >> 8;
            rb += ((vb - rb) * amt) >> 8;
          }
        }
    #endif
      }

      // ---- catchlight ----
      int cdx = x - CORNEA_X, cdy = y - CORNEA_Y;
      int cd2 = cdx * cdx + cdy * cdy;
      if (cd2 < CORNEA_BLOOM_SQ) {
        int cw = ((CORNEA_BLOOM_SQ - cd2) * CORNEA_BLOOM_K) >> 16;
        if (cd2 < CORNEA_CORE_SQ) {
          int cc = ((CORNEA_CORE_SQ - cd2) * CORNEA_CORE_K) >> 16;
          if (cc > cw) cw = cc;
        }
        rr += cw; if (rr > 255) rr = 255;
        rg += cw; if (rg > 255) rg = 255;
        rb += cw; if (rb > 255) rb = 255;
      }

      it.draw_pixel_at(x, y, Color(rr, rg, rb));
    }
  }

  // brow: GONE. The eyeball now inscribes the panel, so there is no row above
  // the ball to put one in.