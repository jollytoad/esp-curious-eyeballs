|-
  // =====================================================================
  // Cartoon eye for a 240x240 round GC9A01A, rendered on a sphere.
  //
  // PORTABILITY NOTE: this build is SOFT-FLOAT. Measured on the target:
  //   sqrtf   = 6000 ns (~960 cycles)
  //   float multiply = 1800 ns (~288 cycles)   <- an FPU would be 1-4
  // At those costs the float version of this loop cost ~33,600 ns per
  // pixel = 957 ms per frame. All per-pixel maths below is therefore done
  // in INTEGER arithmetic; floats are only used once per frame to derive
  // the gaze basis and the iris colours.
  //
  // Model: the eye is a sphere of radius R seen head-on. Every visible
  // pixel has a surface normal; the iris and pupil are two circles ON that
  // sphere, concentric around the eye's forward axis, and the gaze is the
  // angle between that axis and the viewer. Foreshortening, the elliptical
  // iris, the travelling limbal ring and limb darkening all fall out of one
  // rotation - none of it is faked per screen axis.
  //
  // Per-pixel pipeline (integer):
  //   1. r2 = dx*dx + dy*dy
  //   2. nz8 = nz_lut[r2]        -> unit sphere z, 0..255   (1 load)
  //   3. dot the normal with the forward axis -> angle from gaze
  //   4. classify sclera / iris / pupil, shade and draw
  // =====================================================================

  // ================= tunables =================
  // Gaze is stored as angles in degrees. A real eye reaches ~30 deg each way
  // horizontally and ~20 deg vertically; cartoons are more expressive.
  const float YAW_MAX   = 52.0f;
  const float PITCH_MAX = 38.0f;
  const int   GAZE_FRAMES  = 2;      // frames per saccade (80 ms each)
  const int   GAZE_HOLD_MIN = 8;     // 0.64 s at 80 ms/frame
  const int   GAZE_HOLD_MAX = 55;    // 4.4 s

  // Iris size is an ANGLE on the sphere, so it is the same physical size
  // wherever the eye looks. 21 deg renders ~34 px head-on.
  const float IRIS_ANGLE  = 21.0f;
  const float IRIS_BRIGHT = 0.70f;   // fibre highlight, fraction of the iris
  const float PUPIL_MIN = 8.0f;      // px, head-on
  const float PUPIL_MAX = 19.0f;
  const float P_DILATE = 0.010f;
  const float P_HUE    = 0.006f;

  // Sclera shading. The gradient is computed per pixel from a lookup table,
  // so these are pure visual tuning.
  const float SHADE_STRENGTH = 1.00f;
  const float SHADE_VERTICAL = 0.10f;

  const int CX = 120, CY = 120, R = 96;
  const int R_SQ = R * R;

  Color INK(0x1A, 0x14, 0x12);          // outline / brow
  Color SCLERA_HI(0xFF, 0xFD, 0xF6);    // brightest, facing the light
  Color SCLERA_LO(0xA8, 0x9E, 0x8C);    // shadowed, at the rim
  Color SKIN(0x14, 0x10, 0x18);         // backdrop
  Color WHITE(0xFF, 0xFF, 0xFF);

  // ================= lookup tables =================
  // Built once, on the first invocation. Two tables replace every per-pixel
  // square root in the loop, which cost 960 cycles each on the soft-float
  // build and dominated the frame time.
  //
  //   NZ_LUT[r2]     unit sphere z at squared radius r2, Q8.
  //                  nz = sqrt(R^2 - r2) / R * 256. Direct replacement for
  //                  the per-pixel sqrt.
  //   ACROSS_LUT[a]  sqrt(1 - (a/256)^2) * 256. The perpendicular component
  //                  of a unit vector is fixed by its forward component, so
  //                  this is the second sqrt gone.
  //   HALF_LUT[d+R]   half-width of the eyeball on row dy=d. This was a
  //                  sqrtf() per row (193 of them, 960 cycles each); it is
  //                  only a function of dy, so 193 bytes replace all of it.
  //
  // 9.5 kB total, versus 36 kB for a full 2D shade table - and no visible
  // build stall, since this runs a few hundred entries per call.
  static uint8_t NZ_LUT[R_SQ + 1];
  static uint8_t ACROSS_LUT[257];
  static uint8_t HALF_LUT[2 * R + 1];
  static int32_t nz_built = 0;
  {
    if (nz_built < R_SQ + 1) {
      // Build in slices so no single invocation blocks long.
      int32_t end = nz_built + 512;
      if (end > R_SQ + 1) end = R_SQ + 1;
      for (int32_t r2 = nz_built; r2 < end; r2++)
        NZ_LUT[r2] = (uint8_t) (sqrtf((float) (R_SQ - r2)) * 256.0f / (float) R + 0.5f);
      nz_built = end;
    }
    for (int a = 0; a <= 256; a++)
      ACROSS_LUT[a] = (uint8_t) (sqrtf(1.0f - ((float) a / 256.0f) * ((float) a / 256.0f)) * 256.0f + 0.5f);
    // Same sliced approach, 64 rows per call.
    static int32_t half_built = 0;
    if (half_built < 2 * R + 1) {
      int32_t end = half_built + 64;
      if (end > 2 * R + 1) end = 2 * R + 1;
      for (int32_t i = half_built; i < end; i++) {
        int dy = i - R;
        int v = R_SQ - dy * dy;
        int g = (int) sqrtf((float) v);
        while (g * g > v) g--;
        while ((g + 1) * (g + 1) <= v) g++;
        HALF_LUT[i] = (uint8_t) g;
      }
      half_built = end;
    }
  }

  // ================= per-band bookkeeping =================
  // Rect() default-constructs every field to VALUE_NO_SET (32766), so
  // get_clipping() returns a sentinel rect when nothing is clipped - NOT
  // zeros. is_set() is the supported test for that.
  Rect clip = it.get_clipping();
  bool has_clip = clip.is_set();
  bool first_band = !has_clip || (clip.y == 0);

  // ================= metrics =================
  // Set TIMING_DIAG false once tuned: each ESP_LOGI costs real time.
  const bool TIMING_DIAG = true;
  static uint32_t diag_t0 = esphome::millis();
  static uint32_t diag_calls = 0;
  static uint32_t diag_frames = 0;
  static uint32_t diag_rows = 0;
  static uint32_t diag_ms = 0;
  static uint32_t diag_max = 0;
  static uint32_t diag_sqrt_ns = 0;
  static uint32_t diag_fmul_ns = 0;
  uint32_t diag_t_start = esphome::millis();
  uint32_t diag_now = diag_t_start;

  // A/B switch: false = fill only, no per-pixel loop. Kept so the cost of
  // the loop can be re-measured at any time.
  const bool DRAW_MODE_PIXELS = true;

  // One-shot arithmetic benchmark. Reports whether this build has a working
  // FPU, which decides whether float maths is affordable here at all.
  static bool bench_done = false;
  if (!bench_done) {
    bench_done = true;
    const int N = 50000;
    uint32_t t0 = esphome::millis();
    float acc = 0.0f;
    for (int i = 0; i < N; i++)
      acc += sqrtf((float) i);
    uint32_t t1 = esphome::millis();
    float b = 1.0001f;
    for (int i = 0; i < N; i++)
      acc += (float) i * b;
    uint32_t t2 = esphome::millis();
    diag_sqrt_ns = (t1 - t0) * 1000000U / (uint32_t) N;
    diag_fmul_ns = (t2 - t1) * 1000000U / (uint32_t) N;
    ESP_LOGI("eye", "BENCH sqrtf=%u ns  float_mul=%u ns  (50000 iters each)",
             diag_sqrt_ns, diag_fmul_ns);
    if (acc < -1.0f)
      ESP_LOGI("eye", "unreachable");
  }

  // ================= gaze ====================
  // Only advance on the first band of a frame, otherwise the state machine
  // runs once per band and the eye visibly tears.
  if (first_band && id(gmove) > 0) {
    id(gmove)--;
    float t = 1.0f - (float) id(gmove) / (float) GAZE_FRAMES;
    t = t * t * (3.0f - 2.0f * t);     // smoothstep: eases out and settles
    id(yaw)   = id(yaw_s)   + (id(yaw_t)   - id(yaw_s))   * t;
    id(pitch) = id(pitch_s) + (id(pitch_t) - id(pitch_s)) * t;
  } else if (first_band && id(ghold) > 0) {
    id(ghold)--;
  } else if (first_band) {
    // uniform over an ellipse of reachable angles
    float ang = esphome::random_float() * 6.2831853f;
    float rad = sqrtf(esphome::random_float());
    id(yaw_t)   = cosf(ang) * rad * YAW_MAX;
    id(pitch_t) = sinf(ang) * rad * PITCH_MAX;
    id(yaw_s)   = id(yaw);
    id(pitch_s) = id(pitch);
    id(gmove) = GAZE_FRAMES;
    id(ghold) = GAZE_HOLD_MIN +
                (int) (esphome::random_float() * (float) (GAZE_HOLD_MAX - GAZE_HOLD_MIN));
  }

  if (first_band) {
    if (esphome::random_float() < P_DILATE)
      id(pupil_t) = PUPIL_MIN + esphome::random_float() * (PUPIL_MAX - PUPIL_MIN);
    id(pupil) += (id(pupil_t) - id(pupil)) * 0.05f;
    if (esphome::random_float() < P_HUE) {
      id(irt) = esphome::random_float() * 255.0f;
      id(igt) = esphome::random_float() * 255.0f;
      id(ibt) = esphome::random_float() * 255.0f;
    }
    id(ir) += (id(irt) - id(ir)) * 0.02f;
    id(ig) += (id(igt) - id(ig)) * 0.02f;
    id(ib) += (id(ibt) - id(ib)) * 0.02f;
  }

  // ================= the eye's frame =================
  // Rotating the sphere so the iris faces wherever the eye is looking. These
  // are the only floats in the hot path: three cos/sin per frame.
  const float DEG = 0.0174532925f;
  const float yaw_rad = id(yaw) * DEG, pitch_rad = id(pitch) * DEG;
  const float cyw = cosf(yaw_rad), syw = sinf(yaw_rad);
  const float cpt = cosf(pitch_rad), spt = sinf(pitch_rad);

  // eye-local basis in screen space (x right, y down, z toward viewer)
  const float fwd_x = syw * cpt, fwd_y = spt,     fwd_z = cyw * cpt;
  const float rgt_x = cyw,          rgt_y = 0.0f, rgt_z = -syw;
  const float up_x  = -syw * spt,    up_y  = cpt,   up_z  = cyw * spt;

  // Fixed-point versions of the basis for the integer pixel loop. Q8 gives
  // ~0.4 deg of angular resolution, far finer than the shading needs.
  const int FWD_X = (int) (fwd_x * 256.0f);
  const int FWD_Y = (int) (fwd_y * 256.0f);
  const int FWD_Z = (int) (fwd_z * 256.0f);
  const int RGT_X = (int) (rgt_x * 256.0f);
  const int RGT_Y = (int) (rgt_y * 256.0f);
  const int RGT_Z = (int) (rgt_z * 256.0f);
  const int UP_X  = (int) (up_x * 256.0f);
  const int UP_Y  = (int) (up_y * 256.0f);
  const int UP_Z  = (int) (up_z * 256.0f);

  const int COS_IRIS = (int) (cosf(IRIS_ANGLE * DEG) * 256.0f);
  const int SIN_IRIS = (int) (sinf(IRIS_ANGLE * DEG) * 256.0f);
  // pupil px -> angle on the sphere. asin(pupil/R) is the angle whose
  // head-on projection is `pupil` pixels; passing the pixel value straight
  // to sinf() would render the pupil ~1.65x too large.
  const int SIN_PUPIL = (int) (sinf(asinf(fminf(1.0f, id(pupil) / (float) R))) * 256.0f);

  int cr = (int) id(ir), cg = (int) id(ig), cb = (int) id(ib);
  Color iris_dark(cr / 2, cg / 2, cb / 2);
  Color iris_light(cr + (255 - cr) / 3, cg + (255 - cg) / 3, cb + (255 - cb) / 3);

  // The sclera lit term: a fixed directional light, upper left. These become
  // integer coefficients below; the float form is kept for reference.
  const int LIT_X = (int) (-0.55f * 256.0f);
  const int LIT_Y = (int) (-0.45f * 256.0f);
  const int LIT_Z = (int) (0.70f * 256.0f);
  const int VERTICAL_Q8 = (int) (SHADE_VERTICAL * 256.0f);
  const int SHADE_Q8 = (int) (SHADE_STRENGTH * 256.0f);

  // Colour ramps expanded to integers once per frame.
  const int SR = SCLERA_LO.r - SCLERA_HI.r;
  const int SG = SCLERA_LO.g - SCLERA_HI.g;
  const int SB = SCLERA_LO.b - SCLERA_HI.b;
  const int IR_D_R = iris_dark.r,   IR_D_G = iris_dark.g,   IR_D_B = iris_dark.b;
  const int IR_L_R = iris_light.r,  IR_L_G = iris_light.g,  IR_L_B = iris_light.b;

  // ---- division elimination ----
  // A 32-bit integer divide is ~50 cycles on the C3 (RISC-V retires one
  // quotient bit per cycle). The loop was doing four of them per pixel, which
  // was ~200 of the 376 cycles/px measured. Every one is replaced here by a
  // multiply-shift. Verified against the division it replaces: max error 1
  // on a 0-255 scale, which is below the 8-bit quantisation of the result.
  //
  //   x / 255   ->  x >> 8                (error <= 1)
  //   dx * 256 / R -> dx * 683 >> 8       (683/256 = 2.668 vs 256/96 = 2.667)
  //   x * 255 / d -> (x * 255 * RECIP(d)) >> 16
  const int INV_R_Q8 = 683;            // 256 / R, for dx*INV_R_Q8 >> 8
  const int RECIP_SHIFT = 16;
  const int IRIS_BAND = (int) (IRIS_BRIGHT * 255.0f);   // was a float multiply
                                                       // PER PIXEL in the iris
                                                       // branch - 1800 ns each
  const int IRIS_BAND2 = 255 - IRIS_BAND;
  // recip(d) = 65536 / d, guarded so a zero divisor cannot wrap to 0.
  #define EYE_RECIP(d) ((d) > 0 ? (1 << RECIP_SHIFT) / (d) : 1)
  const int RECIP_SPAN   = EYE_RECIP(SIN_IRIS - SIN_PUPIL);
  const int RECIP_BAND   = EYE_RECIP(IRIS_BAND);
  const int RECIP_BAND2  = EYE_RECIP(IRIS_BAND2);
  const int RECIP_IRIS   = EYE_RECIP(SIN_IRIS);
  #undef EYE_RECIP

  // ================= draw =====================
  // Background: use it.fill(), which MipiSpiBuffer OVERRIDES to do a bulk
  // std::fill_n over the band buffer and mark the whole band dirty - about
  // 2 cycles/pixel. The base Display::fill() expands to
  // filled_rectangle(0,0,w,h), which routes every pixel through
  // draw_pixel_at() (clip test + rotation switch + App.feed_wdt()), and that
  // is ~35x slower. Using it also leaves the rows above and below the
  // eyeball unfilled, which shows as a messy border.
  it.fill(SKIN);

  int y_start = CY - R;
  int y_end = CY + R + 1;
  if (has_clip) {
    if (clip.y > y_start) y_start = clip.y;
    if (clip.y + clip.h < y_end) y_end = clip.y + clip.h;
  }

  if (DRAW_MODE_PIXELS) {
    for (int y = y_start; y < y_end; y++) {
      // Keep the task watchdog fed: a full pass is long enough on a 160 MHz
      // C3 that an uninterrupted run can trip it. App.feed_wdt() is public
      // and internally rate-limited, so the common path is a load and branch.
      App.feed_wdt();

      int dy = y - CY;
      int dy_sq = dy * dy;
      // Half-width of the eyeball on this row. Was a sqrtf() here costing
      // 960 cycles per row; it is only a function of dy, so it is a table.
      int half = HALF_LUT[dy + R];

      // Anything that is constant for the whole row is hoisted out of the
      // inner loop here. ny8 in particular was recomputed for every pixel
      // even though it never changes across a row.
      int ny8 = (dy * INV_R_Q8) >> 8;
      int dy_lit = ny8 * LIT_Y;
      int vert = (dy * VERTICAL_Q8) >> 8;   // extra darkening at the bottom

      for (int x = CX - half; x <= CX + half; x++) {
        int dx = x - CX;
        int r2 = dx * dx + dy_sq;

        // Unit sphere normal at this pixel, Q8. nz comes from a table built
        // once (see the setup block) - this replaces the per-pixel sqrt that
        // cost 960 cycles on the soft-float build.
        int nz8 = NZ_LUT[r2];
        int nx8 = (dx * INV_R_Q8) >> 8;

        // component along the eye's forward axis, Q8
        int along = (nx8 * FWD_X + ny8 * FWD_Y + nz8 * FWD_Z) >> 8;

        if (along > COS_IRIS) {
          // On the iris cap. `along` is the angle from the forward axis, so
          // the perpendicular component is fixed: across^2 = 1 - along^2.
          int a = along < 0 ? -along : along;
          if (a > 256) a = 256;
          int across8 = ACROSS_LUT[a];
          if (across8 < SIN_PUPIL) {
            it.draw_pixel_at(x, y, Color(0, 0, 0));
            continue;
          }
          // radial position within the iris, 0 at the pupil, 255 at the limbus
          int s8 = ((across8 - SIN_PUPIL) * 255 * RECIP_SPAN) >> RECIP_SHIFT;
          if (s8 < 0) s8 = 0;
          if (s8 > 255) s8 = 255;
          // smoothstep: eases the fibre pattern at both ends
          s8 = (s8 * s8 * (768 - 2 * s8)) >> 16;
          // split at the bright band: dark -> vivid -> dark
          int k = s8 < IRIS_BAND ? (s8 * 255 * RECIP_BAND) >> RECIP_SHIFT
                                 : ((s8 - IRIS_BAND) * 255 * RECIP_BAND2) >> RECIP_SHIFT;
          int pr = IR_D_R + (((IR_L_R - IR_D_R) * k) >> 8);
          int pg = IR_D_G + (((IR_L_G - IR_D_G) * k) >> 8);
          int pb = IR_D_B + (((IR_L_B - IR_D_B) * k) >> 8);
          // limb darkening: the iris falls off toward its outer edge
          int depth = (across8 * 255 * RECIP_IRIS) >> RECIP_SHIFT;
          int shade = 256 - ((depth * depth * 90) >> 16);
          pr = (pr * shade) >> 8;
          pg = (pg * shade) >> 8;
          pb = (pb * shade) >> 8;
          it.draw_pixel_at(x, y, Color(pr, pg, pb));
          continue;
        }

        // Sclera: same directional light on the same normal. Everything here
        // is integer - no sqrt, no float multiply.
        int lit = (nx8 * LIT_X + dy_lit + nz8 * LIT_Z) >> 8;
        int t8 = 128 - (lit >> 1);
        if (t8 < 0) t8 = 0;
        if (t8 > 255) t8 = 255;
        t8 = (t8 * t8 * (768 - 2 * t8)) >> 16;   // smoothstep shoulder
        t8 += vert;                              // row-constant, hoisted above
        t8 = (t8 * SHADE_Q8) >> 8;
        if (t8 < 0) t8 = 0;
        if (t8 > 255) t8 = 255;
        it.draw_pixel_at(x, y,
                         Color(SCLERA_HI.r + ((SR * t8) >> 8),
                               SCLERA_HI.g + ((SG * t8) >> 8),
                               SCLERA_HI.b + ((SB * t8) >> 8)));
      }
    }
  }

  if (!DRAW_MODE_PIXELS) {
    // Diagnostic path: one cheap primitive so the display is visibly alive.
    it.filled_circle(CX, CY, R - 1, Color(0x60, 0x60, 0x60));
  }

  // ---- specular highlight, fixed on the sphere where the light reflects.
  // It does not follow the iris, which is what sells the eyeball as a
  // physical ball rather than a disc with a picture on it.
  it.filled_circle(CX - 26, CY - 30, 8, WHITE);
  it.filled_circle(CX + 14, CY - 12, 4, WHITE);

  // brow, above the eyeball (top edge is 24)
  int brow_y = 12;
  for (int x = 48; x <= 192; x += 8) {
    float t = (float) (x - CX) / 72.0f;
    int y = brow_y - (int) (7.0f * (1.0f - t * t));
    it.line(x - 4, y, x + 4, y, INK);
  }

  // ---- metrics: report once per second ----
  if (TIMING_DIAG) {
    diag_rows += (uint32_t) (y_end - y_start);
    if (first_band) diag_frames++;
    uint32_t spent = esphome::millis() - diag_t_start;
    diag_ms += spent;
    if (spent > diag_max) diag_max = spent;
    diag_calls++;
    if (diag_now - diag_t0 >= 1000) {
      ESP_LOGI("eye",
               "frames/s=%u calls/s=%u calls_per_frame=%.1f rows_swept/s=%u "
               "lambda_ms_total=%u lambda_ms_max=%u | sqrtf=%uns fmul=%uns",
               diag_frames, diag_calls,
               diag_frames ? (float) diag_calls / (float) diag_frames : 0.0f,
               diag_rows, diag_ms, diag_max, diag_sqrt_ns, diag_fmul_ns);
      diag_t0 = diag_now;
      diag_calls = 0;
      diag_frames = 0;
      diag_rows = 0;
      diag_ms = 0;
      diag_max = 0;
    }
  }
