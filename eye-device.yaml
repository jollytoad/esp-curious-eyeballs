# Target config for the real hardware: ESP32-C3 + 240x240 round GC9A01A.
#
# The animation lives in eye-lambda.yaml and the state in eye-globals.yaml,
# shared with eye-sandbox.yaml so the two cannot drift apart.
#
# PERFORMANCE NOTES for this board (no PSRAM, 160 MHz single core):
#
#   Measured: the lambda is ~41 ms per call, and a full-screen SPI push at
#   10 MHz is ~92 ms. Those two dominate everything else.
#
#   buffer_size: 1.0 is the single biggest win available here, and it is
#   NOT an optimisation - it is a correctness fix for the animation timing.
#
#   MipiSpi draws in horizontal BANDS when the buffer is smaller than a
#   frame, calling the lambda once per band. The lambda cannot detect this:
#   mipi_spi never calls set_clipping(), so get_clipping() is always unset
#   and "first band of the frame" is indistinguishable from "only band".
#   The gaze state machine would then advance once per band instead of once
#   per frame, so at the no-PSRAM default of 1/6 that is SIX times per
#   displayed frame - every GAZE_* constant effectively six times too fast,
#   and a 2-frame saccade lasting a third of a frame.
#
#   It is also wasteful: the lambda sweeps all 193 rows of the eyeball on
#   every call, but draw_pixel_at bounds-checks y against the current band
#   and discards the rest. At 1/6 that is 173,700 pixel computations per
#   displayed frame to produce 28,950 useful ones - 6x waste. (Memory-safe:
#   the bounds check prevents any buffer overflow.)
#
#   A full-frame buffer removes both problems: one band per update, one call,
#   28,950 pixel computations. Measured on-device at 1/6: 2.8 updates/s,
#   353 ms each (246 ms of it lambda). At 1.0: ~133 ms, about 7.5 updates/s.
#
#   FALLBACK: a full buffer needs 115,200 B contiguous. Measured free heap at
#   runtime was 172,080 B but the largest single block only 114,688 B - 512 B
#   short. MipiSpiBuffer allocates in setup(), when the heap is usually less
#   fragmented, so 1.0 should still fit. If the log says
#   "Buffer allocation failed", drop to buffer_size: 0.5 (57,600 B, two
#   bands, still about 3x better than the default) - though 2 bands leaves
#   the gaze advancing twice per frame, which is much less visible.
#
#   auto_clear_enabled: false is REQUIRED, not an optimisation - the
#   incremental renderer in eye-lambda.yaml will not work without it. This
#   option DEFAULTS TO TRUE, and true makes Display::do_update_() wipe the
#   frame to black before the lambda runs, so the display shows black except
#   where the iris just moved. Earlier full-redraw versions masked a missing
#   setting by calling it.fill() every frame. If the display goes black apart
#   from the iris, check this first.
#
esphome:
  name: eye-device
  friendly_name: Eye Device

esp32:
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

globals: !include eye-globals.yaml

spi:
  id: spi_1
  # PLACEHOLDER - you must replace these with your real wiring. The GC9A01A
  # model defines no default bus pins, so ESPHome cannot infer them.
  # These two values are arbitrary placeholders that WILL NOT match your
  # board. Copy the spi: block from your working Home Assistant config.
  # Keep off the C3 strapping pins (GPIO2 / 8 / 9).
  clk_pin: GPIO1     # TODO: replace
  mosi_pin: GPIO7    # TODO: replace

display:
  - platform: mipi_spi
    id: display_mipi_spi_1
    spi_id: spi_1
    model: GC9A01A
    cs_pin: GPIO5
    dc_pin: GPIO3
    reset_pin:
      number: GPIO0
    color_order: BGR
    invert_colors: true
    # Full-frame buffer. See the performance notes at the top of this file -
    # this is what makes the gaze timing correct, not just faster.
    buffer_size: 1.0
    # GC9A01A defines no default data rate, so it falls back to 10 MHz, where
    # a full-screen push costs ~92 ms and tears visibly down the panel.
    # 40 MHz cuts that to ~23 ms. Confirmed working on hardware.
    data_rate: 40MHz
    update_interval: 200ms
    auto_clear_enabled: false
    lambda: !include eye-lambda.yaml

logger:
