# =============================================================================
# The eye, on an ESP32-S3-Zero driving a 240x240 round panel over SPI.
# A complete, standalone backup of the config that is flashed - it validates
# and compiles as-is.
#
# Split across files so the sandbox and the device cannot drift:
#   eye-render.cpp     the renderer, shared with eye-sandbox.yaml
#   eye-globals.yaml   the animation state, shared with eye-sandbox.yaml
#
# -----------------------------------------------------------------------------
# MEMORY: THE BOARD HAS 2 MB OF PSRAM NOW
# -----------------------------------------------------------------------------
# The board is an ESP32-S3-Zero (ESP32-S3FH4R2): 4 MB flash, 512 KB of RAM
# and 2 MB of quad PSRAM inside the package. The `psram:` block below is what
# switches that PSRAM on, and it is not optional - without it mipi_spi's
# RAMAllocator has no external memory to try, and the buffer comes out of
# internal RAM instead.
#
# The full-frame buffer is 115,200 B and wants ONE contiguous block.
#
# This config used to run on an ESP32-C3-Zero: 400 KB of RAM, no PSRAM, and a
# largest heap block of 114,688 B - 512 short. THAT is why there was no wifi,
# api, ota, captive_portal or mdns here. The reason was measured, and it is
# recorded so it is not re-derived.
#
# DIRAM is 341,760 B, all of it in one pool. Link-time use, and what is left:
#
#     stage                     DIRAM used    DIRAM free    minus 115,200
#     no network                    110,771       230,989          115,789
#     wifi + captive_portal         159,803       181,957           66,757
#     + api, mdns, ota, button      160,075       181,685           66,485
#
# THE NETWORK COSTS 49,032 B OF INTERNAL RAM and the Home Assistant side costs
# 272 B. That asymmetry is the whole surprise: the wifi stack is the expensive
# part, and the noise key lives in flash (progmem) so `api:` is nearly free in
# RAM. Anyone budgeting by "how many HA components" is measuring the wrong thing.
#
# Do NOT subtract DIRAM .text (58,711 B) again - it is already inside "used".
# Do NOT read the last column as slack either: it is static allocation only, and
# the wifi stack also allocates pbufs, driver buffers and task stacks at run
# time. The C3 lesson is that nobody found an equation joining the two. The
# honest reading of the last column is "a working board still had this much left".
#
# Verification is unchanged and still the only thing that counts. Read the
# boot log for `display is marked FAILED: Buffer allocation failed`; the
# absence of that line is the proof. The display banner prints REQUESTED
# buffer sizes, so it proves nothing on its own.
#
# -----------------------------------------------------------------------------
# MEASURED: THE BUFFER IS IN PSRAM
# -----------------------------------------------------------------------------
# Read from the debug sensors with the network resident, after boot settled:
#
#     PSRAM free                1,977,568 B   of 2,097,152   -> 119,584 used
#     internal free               212,452 B
#     internal largest block      163,840 B
#     internal min free           198,976 B
#
# 119,584 used against a 115,200 B buffer leaves 4,384 B of allocator
# overhead. That is too tight a match to be anything else, so the frame buffer
# comes out of PSRAM. Everything in this file that said otherwise was a guess,
# and it was wrong in the cautious direction.
#
# The largest INTERNAL block is 163,840 B, which also exceeds 115,200 B, so the
# buffer would have fitted internally as well. PSRAM is simply where
# RAMAllocator put it, which is what it is documented to prefer.
#
# CONSEQUENCE: the old memory argument is dead. "Two vessel textures do not fit"
# was true on the C3 and is not true here - the side 193 ring is 22,288 B, which
# is 0.11 percent of the PSRAM now free. See the git branch back-hemisphere.
#
# -----------------------------------------------------------------------------
# THE NETWORK CAME BACK IN GATES
# -----------------------------------------------------------------------------
# Each gate was flashed and watched before the next was added. A blank panel
# cannot tell you which component caused it, so components go in one at a time.
#
#     gate 1  wifi, captive_portal          49,032 B DIRAM   works
#     gate 2  api, mdns, ota, button            272 B DIRAM   works
#     gate 3  web_server                     unmeasured      held back
#
# Note what that table says: the wifi stack cost 49 KB of internal RAM and the
# entire Home Assistant side cost 272 B. Budget by component and you will
# measure the wrong thing.
#
# CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP is NOT set, so lwIP and the wifi driver
# keep their buffers in internal RAM. That has not mattered, because the buffer
# went to PSRAM and left internal RAM with a 163,840 B block. The flag is still
# the lever to reach for if internal RAM ever gets tight.
#
# -----------------------------------------------------------------------------
# PERFORMANCE: NONE OF THE C3 NUMBERS SURVIVE THE SWAP
# -----------------------------------------------------------------------------
# Measured on the C3: lambda 57 ms; at 80 MHz the SPI push is 11.5 ms
# (115,200 bytes x 8 bits); frame floor ~68.5 ms; ceiling ~14.6 fps.
# update_interval is 90 ms, which left ~21 ms of headroom deliberately
# unused - 78 ms would reach ~12.8 fps but shortens every saccade from
# 360 ms to 312 ms, and that was not wanted.
#
# The C3 was a 160 MHz single core with no FPU, and a float multiply cost
# 1800 ns. The S3 is 240 MHz, dual core, with hardware single-precision
# float. The bake and the per-pixel loop both get faster, and the per-pixel
# loop is integer anyway, so it gains least. The pictures do not change: both
# paths are IEEE 754 single precision. Measure the lambda before touching
# update_interval - it is the number that sets the frame rate.
#
# The lambda was 57 of that ~68 ms floor, so the C3 was lambda-bound, not
# SPI-bound. One thing now cuts the other way: DMA out of PSRAM is slower
# than out of internal RAM, so the push may have grown.
#
# The vessel bake is one-off and NOT part of any of that: 121 ms on the C3's
# first frame, logged as `[I][eye]: vessels baked in NN ms`. The WDT
# survives it. That line is the one worth watching for regressions.
#
#   buffer_size: 1.0 is required for correctness, not speed. mipi_spi draws in
#   horizontal BANDS when the buffer is smaller than a frame, calling the
#   lambda once per band, and the lambda cannot detect it: mipi_spi never
#   calls set_clipping(), so get_clipping() is always unset and "first band
#   of the frame" is indistinguishable from "only band". The gaze state
#   machine would then advance once per band instead of once per frame.
#
#   data_rate: GC9A01A defines no default, so it falls back to 10 MHz, where a
#   full-screen push costs ~92 ms and tears visibly down the panel. 80 MHz is
#   confirmed working on this panel. There is nothing between 40 and 80: from
#   ESPHome's 80 MHz SPI source, divisor rounding accepts only 20, 40 and
#   80 MHz.
# =============================================================================

esphome:
  name: eyeballs-1
  includes:
    - eye-render.cpp
  friendly_name: Eye

esp32:
  # The exact chip on this board: 4 MB quad flash, 2 MB quad PSRAM.
  board: esp32-s3-fh4r2
  flash_size: 4MB
  framework:
    type: esp-idf

# Switches on the package PSRAM, which is what makes the frame buffer fit.
psram:
  mode: quad
  speed: 80MHz

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # esp32 defaults to `light`, which lets the radio sleep between beacons.
  # Some access points drop it for seconds at a time, and an eye that freezes
  # and recovers on its own looks like a renderer fault. `none` is the setting
  # worth having here.
  power_save_mode: none
  ap:
    ssid: "Eye fallback"
    password: !secret fallback_ap_password

# The fallback AP only appears if the stored credentials fail to associate, so
# this costs nothing on a board that connects. It is here so a moved router is
# recoverable without opening the panel.
captive_portal:

api:
  encryption:
    key: !secret api_encryption_key
  # 0 disables the reboot that ESPHome does by default when nothing connects.
  # DO NOT set this to the default 15min: presence is driven locally by
  # eye-presence.yaml, not by Home Assistant, so the eye is fully functional
  # with HA down. The default would reboot the panel every 15 minutes for as
  # long as HA was unreachable, which is a far worse fault than no HA at all.
  reboot_timeout: 0s

mdns:

# Pulls in safe_mode automatically, so do not add it separately. The partition
# table already carries otadata plus two ota_n slots, so this costs no flash
# layout change.
ota:
  - platform: esphome

button:
  # So a wedged board can be restarted from Home Assistant instead of over USB.
  - platform: restart
    name: "Eye Restart"

# WHERE THE 115,200 B FRAME BUFFER ACTUALLY IS - still unmeasured.
#
# These are first-class ESPHome sensors, not a hand-rolled interval with a
# heap_caps_* lambda. That distinction is the whole point: AGENTS.md records an
# interval block of that shape breaking a working C3 build on its own, when the
# margin was 512 bytes. There is no margin like that here, but the cheaper way
# to ask the question wins.
#
# The readout that answers it is psram_free, checked AFTER the display has
# allocated at boot:
#
#   psram_free near 1.9 MB   the buffer is in PSRAM; internal RAM is untouched
#   psram_free near 2.0 MB   the buffer came out of internal RAM, and
#                            internal_free will show the 115,200 B dip instead
#
# internal_min_free is the one to watch over days: it is the low-water mark, so
# it catches a slow leak that free alone would never show.
debug:

sensor:
  - platform: debug
    free:
      name: "Internal free"
    psram:
      name: "PSRAM free"
    min_free:
      name: "Internal min free"
    block:
      name: "Internal largest block"

# USB_CDC, not USB_SERIAL_JTAG: this board has NO usb-serial chip. The USB-C
# port goes straight to the S3's native USB on GPIO19/20, which are not even
# broken out. UART0 is on pads 16/17 (GPIO43/44) with nothing attached to
# read them. This is the one diagnostic channel that still works when the
# network is what is broken.
logger:
  hardware_uart: USB_CDC

spi:
  - id: spi_1
    # Real wiring. The S3 straps GPIO0/3/45/46; of those only 3 and 45 are
    # broken out here, and neither is used. GPIO21 is NOT free: it drives the
    # onboard RGB LED. GPIO19/20 are USB, GPIO26-32 are flash, and GPIO33-37
    # are not broken out.
    clk_pin: GPIO4
    # Must be mosi_pin, not mosi: ESPHome 2026.9.1 rejects the short form in
    # this position ("Did you mean [mosi_pin]?").
    mosi_pin: GPIO1

globals: !include eye-globals.yaml

# The only writer of `presence` on either target. No sensor is wired up; this
# stands in for one so the eye can be seen reacting on the panel. Shared with
# eye-sandbox.yaml so the two cannot drift - see the file for why it cannot
# simply flip on a fixed period.
interval: !include eye-presence.yaml

display:
  - platform: mipi_spi
    id: display_mipi_spi_1
    spi_id: spi_1
    model: GC9A01A
    # All five signals land on one header row, pads 4, 5, 7, 8 and 9.
    cs_pin: GPIO5
    dc_pin: GPIO6
    # GPIO0 is the BOOT button on this board and is not broken out, so reset
    # cannot go where it went on the C3.
    reset_pin:
      number: GPIO2
    color_order: BGR
    invert_colors: true
    # Not negotiable - see the banding note above.
    buffer_size: 1.0
    data_rate: 80MHz
    # MUST match eye-sandbox.yaml.
    update_interval: 90ms
    auto_clear_enabled: false
    lambda: |-
      // eye_render lives in a .cpp under `esphome: includes:`, which is NOT
      // #included into main.cpp, so it needs declaring here. The argument ORDER
      // must match eye-render.cpp; the compiler cannot catch a swap.
      void eye_render(esphome::display::Display *,
                      float *, float *, float *,
                      float *, float *, float *,
                      int *, int *, int *,
                      int *, float *, int *, int *);
      eye_render(&it, &id(yaw), &id(pitch),
                 &id(yaw_t), &id(pitch_t),
                 &id(yaw_s), &id(pitch_s),
                 &id(gmove), &id(ghold), &id(frame),
                 &id(presence), &id(pres_f),
                 &id(pres_hold), &id(pres_seen));
