# =============================================================================
# The eye, on a C3-class board driving a 240x240 round panel over SPI.
# A complete, standalone backup of the config that is flashed - it validates
# and compiles as-is.
#
# Split across files so the sandbox and the device cannot drift:
#   eye-render.cpp     the renderer, shared with eye-sandbox.yaml
#   eye-globals.yaml   the animation state, shared with eye-sandbox.yaml
#
# -----------------------------------------------------------------------------
# NO NETWORK HERE, AND THAT IS DELIBERATE
# -----------------------------------------------------------------------------
# No wifi, api, ota, captive_portal or mdns. The full-frame display buffer
# does not fit on this board while WiFi is resident.
#
# MipiSpiBuffer asks heap_caps_malloc_prefer for ONE contiguous 115,200 B
# block. Measured on this hardware with WiFi, api, ota and a web server
# resident:
#
#     free heap            75,856 B     <- already below the 115,200 B asked
#     largest free block   61,440 B     <- 53,760 B short of it
#
# So this is not fragmentation - there was not enough total memory, and WiFi
# is the dominant consumer. Stripping the other components too (captive_portal
# pulls in web_server_base, ota.web_server and lwIP sockets; api with noise
# encryption is ~15 kB; ota plus safe_mode ~5 kB) still leaves ~120 kB free
# needing 115,200 B in a SINGLE block. That does not happen across a WiFi
# stack that scatters many small buffers.
#
# The board has no PSRAM, so there is no third option. Dropping WiFi frees
# enough for the full-frame buffer on its own.
#
# WHAT THIS COSTS: no Home Assistant, no wireless update, no fallback access
# point. Flashing is over USB, and logging is unaffected - the logger runs on
# USB_SERIAL_JTAG, which is independent of WiFi.
#
# If HA is ever wanted back it cannot coexist with buffer_size 1.0. The choice
# is HA or a full-frame buffer. secrets.yaml retains api_encryption_key and
# fallback_ap_password for that day; re-adding the components also means
# re-adopting the device in HA.
#
# -----------------------------------------------------------------------------
# MEMORY IS THE BINDING CONSTRAINT, AND IT IS NOT PREDICTABLE
# -----------------------------------------------------------------------------
# The frame buffer needs 115,200 B in ONE contiguous block. The largest block
# this board will hand over is 114,688 B - 512 short - and the only symptom is
# `[E][component:297]: display set Error flag: Buffer allocation failed`, after
# which the panel stays blank. There is no partial result to notice.
#
# Measured by flash, not derived:
#
#     ~79,4xx  no vessels                              works
#     96,400   vessels in a packed ring, side 129      works
#     98,992   same, side 145                          works
#     101,920  same, side 161                          works
#     108,656  same, side 193                          works
#     103,000  front-only vessels, side 129 square     works
#     119,696                                          fails
#     125,104                                          fails
#     146,144  side 161                                fails
#
# The ceiling is somewhere between 108,656 and 119,696. That 11,040 B gap has
# never been measured - do not treat 108,656 as the wall.
#
# NOT MONOTONIC: 79.4K works, 79,584 fails, 103K works again. There is no
# threshold to calculate, and three equations built to explain this were all
# wrong - one of them fitted to a table row that had been invented rather than
# measured. Read the RAM: line from the build output, then flash, then read
# whether the failure line appears. Do not reason it out.
#
# Watch for this in particular: adding an `interval:` block with a
# `heap_caps_*` lambda was by itself enough to break a build that worked
# without one. A device-only heap readout is convenient right up until it is
# the thing that stops the display starting.
#
# Two vessel textures do not fit and one does. That is why eye-render.cpp keeps
# a single array and writes only the front hemisphere; see the EYE_VEINS note
# there for what the far side of the globe shows as a result. A second array is
# still not affordable - the smallest worth having, a side 113 ring, would put
# this build at 116,392, inside the unmeasured gap above.
#
# -----------------------------------------------------------------------------
# PERFORMANCE (no PSRAM, 160 MHz single core)
# -----------------------------------------------------------------------------
#   Measured on device: lambda 57 ms. At 80 MHz the SPI push is 11.5 ms
#   (115,200 bytes x 8 bits), so the frame floor is ~68.5 ms and ~14.6 fps is
#   the ceiling. update_interval is 90 ms, leaving ~21 ms of headroom that is
#   deliberately unused - dropping it to 78 ms would reach ~12.8 fps but
#   shortens each saccade from 360 ms to 312 ms, which was not wanted.
#
#   Note the lambda is 57 of the ~68 ms floor: the frame rate is lambda-bound,
#   not SPI-bound. Further gains have to come from the per-pixel loop. The
#   vessel texture is sampled in that loop, so the 57 ms was measured WITH it.
#
#   The vessel bake is one-off and NOT part of that figure: 121 ms on the first
#   frame, logged as `[I][eye]: vessels baked in NN ms`. The WDT survives it.
#
#   buffer_size 1.0 is required for correctness, not speed. mipi_spi draws in
#   horizontal BANDS when the buffer is smaller than a frame, calling the
#   lambda once per band, and the lambda cannot detect it: mipi_spi never
#   calls set_clipping(), so get_clipping() is always unset and "first band
#   of the frame" is indistinguishable from "only band". The gaze state
#   machine would then advance once per band instead of once per frame.
#
#   data_rate: GC9A01A defines no default, so it falls back to 10 MHz, where a
#   full-screen push costs ~92 ms and tears visibly down the panel. 80 MHz is
#   confirmed working on this panel. There is nothing between 40 and 80: from
#   ESPHome's 80 MHz SPI source, divisor rounding accepts only 20, 40 and
#   80 MHz.
# =============================================================================

esphome:
  name: esp32-c3-zero-a
  includes:
    - eye-render.cpp
  friendly_name: Eye

esp32:
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

# USB_SERIAL_JTAG, so no network needed. This is the device's only
# diagnostic channel.
logger:

spi:
  - id: spi_1
    # Real wiring. Keep off the C3 strapping pins (GPIO2 / 8 / 9).
    clk_pin: GPIO4
    # Must be mosi_pin, not mosi: ESPHome 2026.9.1 rejects the short form in
    # this position ("Did you mean [mosi_pin]?").
    mosi_pin: GPIO1

globals: !include eye-globals.yaml

display:
  - platform: mipi_spi
    id: display_mipi_spi_1
    spi_id: spi_1
    model: GC9A01A
    cs_pin: GPIO5
    dc_pin: GPIO3
    reset_pin:
      number: GPIO0
    color_order: BGR
    invert_colors: true
    # Not negotiable - see the banding note above.
    buffer_size: 1.0
    data_rate: 80MHz
    # MUST match eye-sandbox.yaml.
    update_interval: 90ms
    auto_clear_enabled: false
    lambda: |-
      // eye_render lives in a .cpp under `esphome: includes:`, which is NOT
      // #included into main.cpp, so it needs declaring here. The argument ORDER
      // must match eye-render.cpp; the compiler cannot catch a swap.
      void eye_render(esphome::display::Display *,
                      float *, float *, float *,
                      float *, float *, float *,
                      int *, int *, int *);
      eye_render(&it, &id(yaw), &id(pitch),
                 &id(yaw_t), &id(pitch_t),
                 &id(yaw_s), &id(pitch_s),
                 &id(gmove), &id(ghold), &id(frame));
